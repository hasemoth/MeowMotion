<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MeowMotion">
<meta name="theme-color" content="#F4F2F8">
<title>MeowMotion</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600;700&display=swap">
<style>
:root{
  --paper:#F4F2F8;--surface:#FFFFFF;--ink:#23202B;--ink2:#66617A;--ink3:#9893AA;--line:#E8E4F0;
  --lav:#ECE8FB;--lavD:#5A49C2;--lavM:#9C8CF0;
  --mint:#DDF3EA;--mintD:#1B6E4E;--leaf:#17865E;--leafM:#4CC48F;
  --peach:#FFE3D6;--peachD:#A3401F;--peachM:#F4845F;
  --honey:#FFF0C7;--honeyD:#8A5A00;
  --move:#EE5D5D;--ex:#23A272;--stand:#2F94D0;
  --bg:var(--paper);
  --raise:0 1px 2px rgba(35,32,43,.04),0 12px 28px -18px rgba(35,32,43,.22);
  --raise-btn:0 1px 2px rgba(35,32,43,.05);
  --display:'Mali','IBM Plex Sans Thai Looped',system-ui,sans-serif;
  --body:'IBM Plex Sans Thai Looped',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:700}
:focus-visible{outline:2.5px solid var(--lavD);outline-offset:2px;border-radius:12px}
.app{max-width:480px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 18px calc(96px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px}
.title{font-family:var(--display);font-size:28px;line-height:34px;font-weight:700;letter-spacing:-.2px}
.catname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:13px;color:var(--ink2)}
.row{display:flex;align-items:center}.col{display:flex;flex-direction:column}
.g4{gap:4px}.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}
.between{justify-content:space-between}.grow{flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.chip.lav{color:var(--lavD);background:var(--lav)}.chip.mint{color:var(--mintD);background:var(--mint)}.chip.peach{color:var(--peachD);background:var(--peach)}.chip.honey{color:var(--honeyD);background:var(--honey)}
.pills{display:flex;gap:6px;flex-shrink:0}
.pill{display:flex;align-items:center;gap:5px;font-weight:700;font-size:14.5px;padding:6px 11px 6px 7px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.coin{background:var(--honey);color:var(--honeyD)}.pill.salmon{background:var(--peach);color:var(--peachD)}
.pill.bump{animation:bump .5s}
.card{background:var(--surface);border-radius:22px;padding:14px 16px;border:1px solid var(--line);box-shadow:var(--raise)}
.muted{color:var(--ink2)}.small{font-size:12.5px}.tiny{font-size:11.5px}
.bars{display:flex;flex-direction:column;gap:8px}
.track{height:7px;border-radius:999px;background:#F0EDF5;overflow:hidden}
.fill{height:100%;border-radius:999px;transition:width .7s cubic-bezier(.34,1.56,.64,1)}

/* ---------- the room (hero) ---------- */
.room{position:relative;height:min(430px,54vh);min-height:330px;flex-shrink:0;border-radius:30px;overflow:hidden;isolation:isolate;touch-action:none;user-select:none;-webkit-user-select:none;
  --wall:#EEE9FB;--wall2:#E2DAF6;--floor:#E9C9A6;--floor2:#D9B28B;--plank:rgba(120,72,38,.12);--light:rgba(255,246,214,.85);--sky:linear-gradient(#9DD3F5,#E2F3FC);--frame:#FFFFFF;background:var(--wall)}
.room[data-tod=dawn]{--wall:#F5E8EE;--wall2:#EBD8E4;--floor:#EBC7A8;--floor2:#DBAE8E;--light:rgba(255,214,190,.8);--sky:linear-gradient(#B9D7F2,#FDD9B5)}
.room[data-tod=golden]{--wall:#F6E3D3;--wall2:#EDCDB7;--floor:#E6BC92;--floor2:#D29F74;--light:rgba(255,190,110,.75);--sky:linear-gradient(#F4B37A,#F9DDB0)}
.room[data-tod=night]{--wall:#3B3560;--wall2:#2F2A52;--floor:#5A4A63;--floor2:#463A52;--plank:rgba(0,0,0,.16);--light:transparent;--sky:linear-gradient(#1C2141,#3B3F6B);--frame:#D9D2F2}
.wall{position:absolute;inset:0 0 43% 0;background:linear-gradient(var(--wall),var(--wall2))}
.wall:after{content:"";position:absolute;left:0;right:0;bottom:0;height:7px;background:rgba(60,40,70,.07)}
.floor{position:absolute;left:0;right:0;bottom:0;height:43%;background:linear-gradient(var(--floor2),var(--floor) 45%);overflow:hidden}
.floor:before{content:"";position:absolute;left:-60%;right:-60%;top:0;bottom:-30%;background:repeating-linear-gradient(90deg,transparent 0 50px,var(--plank) 50px 52px);transform:perspective(160px) rotateX(52deg);transform-origin:50% 0}
.window{position:absolute;left:7%;top:7%;width:26%;max-width:118px;aspect-ratio:.86;border-radius:14px;background:var(--sky);border:6px solid var(--frame);overflow:hidden;box-shadow:0 6px 16px -10px rgba(40,30,60,.35)}
.window:before,.window:after{content:"";position:absolute;background:var(--frame)}
.window:before{left:50%;top:0;bottom:0;width:5px;margin-left:-2.5px}.window:after{top:52%;left:0;right:0;height:5px}
.sun{position:absolute;left:14%;top:12%;width:22%;aspect-ratio:1;border-radius:50%;background:#FFE7A3;box-shadow:0 0 18px 4px rgba(255,231,163,.6)}
.room[data-tod=night] .sun{background:#F3EFD8;box-shadow:inset -6px -3px 0 #3B3F6B,0 0 14px rgba(243,239,216,.35)}
.sunpatch{position:absolute;left:2%;bottom:13%;width:58%;height:30%;background:linear-gradient(105deg,var(--light),transparent 78%);clip-path:polygon(10% 0,44% 0,100% 100%,0 100%);opacity:.75;pointer-events:none}
.lampglow{position:absolute;right:-12%;top:-8%;width:70%;aspect-ratio:1;border-radius:50%;background:radial-gradient(closest-side,rgba(255,206,140,.42),transparent);display:none;pointer-events:none}
.room[data-tod=night] .lampglow{display:block}
.room .stage{position:absolute;inset:0;z-index:2}
.room .c3d{position:absolute;inset:0;width:100%;height:100%;display:block}
.cushion{position:absolute;left:50%;bottom:10%;width:184px;height:42px;margin-left:-92px;border-radius:50%;background:#C9BCF5}
.catwrap{position:absolute;left:50%;bottom:calc(10% + 10px);width:156px;height:156px;margin-left:-78px;cursor:grab;touch-action:none;z-index:2}
.catwrap svg{width:100%;height:100%;overflow:visible}
.decor{position:absolute;pointer-events:none;z-index:1}
.decor.front{z-index:3}
.moodtag{position:absolute;left:12px;top:12px;z-index:4;font-size:12px;font-weight:700;color:var(--ink);background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:4px 10px;border-radius:999px;pointer-events:none}
.bubble{position:absolute;right:12px;top:12px;z-index:4;max-width:58%;background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:16px 16px 4px 16px;padding:7px 12px;font-size:13.5px;font-weight:600;box-shadow:0 6px 16px -8px rgba(60,40,90,.3);animation:pop .35s cubic-bezier(.34,1.56,.64,1);pointer-events:none}
.hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:4;white-space:nowrap;font-size:12px;font-weight:600;color:var(--ink2);background:rgba(255,255,255,.8);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding:4px 11px;border-radius:999px;pointer-events:none;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.room[data-tod=night] .moodtag,.room[data-tod=night] .hint{background:rgba(30,26,52,.6);color:#F1EEFA}
.heart{position:absolute;width:20px;height:20px;pointer-events:none;z-index:5;animation:float 1.1s ease-out forwards}
.zzz{position:absolute;z-index:5;font-family:var(--display);font-weight:700;color:#B8ACF4;pointer-events:none;animation:zzf 2.4s ease-out forwards}
@keyframes zzf{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(16px,-44px)}}
.cat3d-img{display:block;width:100%;height:100%;object-fit:contain}
/* 2D cat parts (fallback) */
.cat .c-body{transform-box:view-box;transform-origin:100px 192px;animation:breathe 3.4s ease-in-out infinite}
.cat.slow .c-body{animation-duration:5.6s}
.cat .c-head{transform-box:view-box;transform-origin:100px 118px}
.cat .c-earL{transform-box:view-box;transform-origin:70px 62px}
.cat .c-earR{transform-box:view-box;transform-origin:130px 62px}
.cat .c-eyes{transform-box:view-box;transform-origin:100px 80px}
.cat .c-look{transform-box:view-box}
.cat .c-pawL{transform-box:view-box;transform-origin:80px 186px}
.cat .c-pawR{transform-box:view-box;transform-origin:120px 186px}
.cat .c-whisk{transform-box:view-box;transform-origin:100px 96px}
.cat .e-open,.cat .e-happy,.cat .e-closed,.cat .m-w,.cat .m-open,.cat .m-o,.cat .m-down,.cat .m-yawn{display:none}
.cat[data-eyes=open] .e-open,.cat[data-eyes=happy] .e-happy,.cat[data-eyes=closed] .e-closed{display:inline}
.cat[data-mouth=w] .m-w,.cat[data-mouth=open] .m-open,.cat[data-mouth=o] .m-o,.cat[data-mouth=down] .m-down,.cat[data-mouth=yawn] .m-yawn{display:inline}
.cat.hop{animation:hop .5s cubic-bezier(.34,1.56,.64,1)}
.cat.wiggle{animation:wiggle .5s ease-in-out 2}

/* ---------- status + actions ---------- */
.meters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:12px 14px}
.meter{display:flex;flex-direction:column;gap:6px;min-width:0}
.meter .mh{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.meter .mh b{margin-left:auto;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.quick{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:10px}
.quick .btn{height:56px;border-radius:18px;font-size:14.5px;gap:7px;padding:0 10px}
.ico{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.banner{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:10px 12px 10px 14px;box-shadow:var(--raise);animation:pop .4s}
.banner p{margin:0;font-size:13.5px;font-weight:600;flex:1}
.ringsrow{display:flex;align-items:center;gap:16px}
.metric{display:flex;align-items:baseline;justify-content:space-between}
.metric b{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}.metric span.u{font-size:12.5px;font-weight:500;color:var(--ink2)}
.divider{height:1px;background:var(--line)}
.btn{min-height:44px;border:none;border-radius:16px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 16px;cursor:pointer;white-space:nowrap;text-decoration:none;transition:transform .12s,background .2s}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.primary{background:var(--leaf);color:#fff;box-shadow:0 8px 18px -10px rgba(23,134,94,.7)}
.btn.lavb{background:var(--lavD);color:#fff}
.btn.soft{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:var(--raise-btn)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.honeyb{background:var(--honey);color:var(--honeyD)}
.btn.outline{background:#fff;color:var(--honeyD);border:1.5px solid #F2D27A}
.btn.danger{background:#B3261E;color:#fff}
.btn.full{width:100%}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:6px 12px env(safe-area-inset-bottom);background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border-top:1px solid var(--line)}
.tabbar .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));height:56px}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--ink3);font-size:11px;font-weight:600;border-radius:14px}
.tabbar a.on{color:var(--lavD);font-weight:700}
.fr{align-items:center}.fr .rank{width:20px;font-weight:700;color:var(--ink2);text-align:center;font-size:13px}
.fr .art img,.fr .art svg{width:42px;height:42px}.meRow{background:#F4F0FF;border-color:#DCD3FB!important}
.chatb{background:#F4F1FA;border-radius:4px 16px 16px 16px;padding:7px 11px;font-size:13.5px;line-height:1.45}
.cheer{border:0;background:#F6F3FB;border-radius:10px;width:32px;height:32px;font-size:15px;cursor:pointer}.cheer:active{transform:scale(.9)}
.inp{min-height:44px;border:1.5px solid #E3DEEE;border-radius:14px;padding:0 12px;font-weight:600;font-size:15px;background:#fff;color:inherit;width:100%}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));background:#ECE9F3;border-radius:14px;padding:4px;height:44px}
.seg button{border:none;border-radius:11px;background:transparent;font-size:14px;font-weight:600;color:var(--ink2);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 4px rgba(60,50,90,.14)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.big{font-size:20px;line-height:24px;font-weight:700;font-variant-numeric:tabular-nums}
.mini-track{height:6px;border-radius:999px;background:#EFEBFB;overflow:hidden}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px}
.chips::-webkit-scrollbar{display:none}
.chips button{height:38px;padding:0 15px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:14px;font-weight:600;flex-shrink:0;cursor:pointer}
.chips button.on{background:var(--ink);color:#fff;border-color:transparent;font-weight:700}
.item{background:#fff;border:1px solid var(--line);border-radius:22px;padding:10px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--raise)}
.item .art{position:relative;height:72px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.item h3{font-size:15px;font-weight:700}
.lock{position:absolute;top:7px;right:7px;width:26px;height:26px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}
.note{font-size:11.5px;font-weight:600;color:var(--peachD);text-align:center}
.sheet-back{position:fixed;inset:0;z-index:40;background:rgba(35,32,43,.38);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:480px;max-height:90vh;overflow:auto;background:var(--paper);border-radius:28px 28px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));animation:up .34s cubic-bezier(.34,1.25,.64,1)}
.grab{width:40px;height:5px;border-radius:3px;background:#D9D5E3;margin:0 auto 14px}
.sheet h2{font-family:var(--display);font-size:21px;font-weight:700;margin-bottom:4px}
.list{display:flex;flex-direction:column;gap:10px}
.lrow{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px 12px}
.lrow .art{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12.5px;font-weight:600;color:var(--ink2)}
.input{height:46px;border-radius:14px;border:1.5px solid #E2DEEC;background:#fff;padding:0 14px;font-size:16px;font-weight:600;width:100%}
.input:focus{outline:none;border-color:var(--lavM)}
textarea.input{height:96px;padding:12px 14px;font-size:14px;font-weight:500;resize:vertical}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.steps code{background:#EFEBFB;color:var(--lavD);padding:1px 6px;border-radius:6px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;word-break:break-all}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));z-index:60;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:var(--ink);color:#fff;font-weight:600;font-size:14px;padding:10px 16px;border-radius:999px;box-shadow:0 10px 24px rgba(35,32,43,.25);animation:drop .35s cubic-bezier(.34,1.4,.64,1);max-width:92vw}
.toast.out{animation:lift .3s forwards}
.switch{position:relative;width:51px;height:31px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;border-radius:999px;background:#D9D5E3;transition:.2s;cursor:pointer}
.switch span:before{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:.2s}
.switch input:checked+span{background:var(--ex)}
.switch input:checked+span:before{transform:translateX(20px)}
.switch input:focus-visible+span{outline:2px solid var(--lavD);outline-offset:2px}
.breeds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.breed{background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:8px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font:inherit;color:inherit}
.breed.on{border-color:var(--lavD);background:#F7F4FF}
.breed[disabled]{cursor:default;background:#FAF9FC}
.breed .art{width:76px;height:76px;display:block}
.breed .art svg{width:76px;height:70px}
.splash{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.onb{display:flex;flex-direction:column;gap:16px;padding-top:6px}
.onb .room{height:min(360px,46vh);min-height:280px}
.onb ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.loglist{display:flex;flex-direction:column}
.logrow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #F0EDF6;font-size:13.5px}
.logrow:last-child{border-bottom:none}
.empty{font-size:13px;color:var(--ink2);text-align:center;padding:8px 0}
a.link{color:var(--lavD);font-weight:700;text-decoration:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- live workout companion ---------- */
.wk{position:fixed;inset:0;z-index:50;background:#1E1D26;overflow:hidden;animation:fade .25s;user-select:none;-webkit-user-select:none}
.wk-scene{position:absolute;left:0;right:0;top:0;height:72%;overflow:hidden;transition:filter 1.2s}
.wk-scene .sky{position:absolute;inset:0;transition:background 1.5s}
.wk-scene[data-sky=dawn] .sky{background:linear-gradient(#B9D7F2,#FDD9B5)}
.wk-scene[data-sky=day] .sky{background:linear-gradient(#8FCBF2,#DDF1FB)}
.wk-scene[data-sky=golden] .sky{background:linear-gradient(#F4B37A,#F9DDB0)}
.wk-scene[data-sky=night] .sky{background:linear-gradient(#1C2141,#3B3F6B)}
.wk-scene[data-wx=cloud] .sky,.wk-scene[data-wx=rain] .sky{filter:saturate(.45) brightness(.92)}
.sunmoon{position:absolute;width:46px;height:46px;border-radius:50%;background:#FFE7A3;box-shadow:0 0 40px 10px rgba(255,231,163,.55);transition:all 1.5s}
.wk-scene[data-sky=dawn] .sunmoon{left:14%;top:30%}.wk-scene[data-sky=day] .sunmoon{left:70%;top:8%}.wk-scene[data-sky=golden] .sunmoon{left:78%;top:26%;background:#FFC879}
.wk-scene[data-sky=night] .sunmoon{left:74%;top:10%;background:#F3EFD8;box-shadow:inset -10px -4px 0 #3B3F6B,0 0 24px rgba(243,239,216,.4)}
.wk-scene[data-wx=rain] .sunmoon,.wk-scene[data-wx=cloud] .sunmoon{opacity:.25}

function seeded(str){ let h = 1779033703 ^ str.length; for (let i = 0; i < str.length; i++){ h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h << 13 | h >>> 19; }
  return () => { h = Math.imul(h ^ h >>> 16, 2246822507); h = Math.imul(h ^ h >>> 13, 3266489909); h ^= h >>> 16; return (h >>> 0) / 4294967296; }; }
const League = {
  st(){ if (!S.bots) S.bots = {tier:0, week:'', base:0, hist:[], sent:{}, cheerDay:'', ahead:null, pending:null}; return S.bots; },
  weekKey(k){ k = k || today(); const d = keyToDate(k), wd = (d.getDay() + 6) % 7; return addDays(k, -wd); },
  userWeek(wk){ let m = 0; for (let i = 0; i < 7; i++){ const k = addDays(wk, i); if (k > today()) break; m += effEx(peek(k)); } return Math.round(m); },
  baseline(){
    const wk = this.weekKey(), ws = [1, 2, 3, 4].map(i => this.userWeek(addDays(wk, -7 * i))).filter(m => m > 0);
    const avg = ws.length ? ws.reduce((a, b) => a + b, 0) / ws.length : 120;
    return Math.round(clamp(avg * 1.05, 90, 600));
  },
  botWeek(b, wk, upto){
    const st = this.st(), r = seeded(b.id + wk), T = st.base * b.mult * (1 + .07 * st.tier) * (0.88 + r() * .24);
    const w = Array.from({length:7}, () => r() < b.rest ? 0 : 0.7 + r() * .6), sw = w.reduce((a, x) => a + x, 0) || 1;
    const now = new Date(), tk = today(); let m = 0, todayMin = 0;
    for (let i = 0; i < 7; i++){
      const k = addDays(wk, i), dm = T * w[i] / sw;
      if (upto && k < upto || !upto && k < tk){ m += dm; continue; }
      if (k === tk && !upto){ const hr = now.getHours() + now.getMinutes() / 60, f = clamp((hr - b.hour) / 1.3, 0, 1); todayMin = dm * (f * f * (3 - 2 * f)); m += todayMin; }
    }
    return {min:Math.round(m), today:Math.round(todayMin), target:Math.round(T)};
  },
  rows(wk, final){
    wk = wk || this.weekKey();
    const upto = final ? addDays(wk, 7) : null;
    const rows = BOTS.map(b => { const x = this.botWeek(b, wk, upto); return {id:b.id, bot:b, name:b.name, cat:b.cat, breed:b.breed, min:x.min, today:x.today}; });
    rows.push({id:'me', me:true, name:'คุณ', cat:cat().name, breed:cat().breed, min:this.userWeek(wk), today:Math.round(effEx(peek(today())))});
    rows.sort((a, b) => b.min - a.min || (a.me ? -1 : 1));
    return rows;
  },
  ensure(){
    const st = this.st(), wk = this.weekKey();
    if (st.week === wk) return null;
    let res = null;
    if (st.week){
      const rows = this.rows(st.week, true), rank = rows.findIndex(r => r.me) + 1, total = rows.reduce((a, r) => a + r.min, 0), team = total >= 900;
      const coins = PRIZE[rank - 1] + (team ? 60 : 0), salmon = (rank === 1 ? 1 : 0) + (team ? 1 : 0), old = st.tier;
      if (rank <= 2) st.tier = Math.min(4, st.tier + 1); else if (rank >= 5) st.tier = Math.max(0, st.tier - 1);
      S.coins += coins; S.salmon += salmon; addLog(`ลีก${TIERS[old]} ได้อันดับ ${rank}${team ? ' + ภารกิจทีมสำเร็จ' : ''}`, coins);
      res = {rank, coins, salmon, team, old, tier:st.tier, total};
      st.hist.unshift({week:st.week, rank, tier:old, min:rows.find(r => r.me).min}); st.hist = st.hist.slice(0, 12);
    }
    st.week = wk; st.base = this.baseline(); st.ahead = null; st.sent = {}; if (res) st.pending = res;
    save(); return res;
  },
  check(){
    if (!S) return; this.ensure(); const st = this.st(), res = st.pending; st.pending = null;
    if (res) setTimeout(() => openSheet(`<div class="col g10" style="align-items:center;text-align:center"><div style="font-size:54px">${TIER_ICON[res.tier]}</div>
      <h2>จบลีกสัปดาห์ที่แล้ว · อันดับ ${res.rank}</h2>
      <p class="muted" style="margin:0">${res.tier > res.old ? 'เลื่อนชั้นขึ้นลีก' + TIERS[res.tier] + '! คู่แข่งจะเก่งขึ้นนะ' : res.tier < res.old ? 'ตกลงไปลีก' + TIERS[res.tier] + ' สัปดาห์นี้เอาคืนได้' : 'อยู่ลีก' + TIERS[res.tier] + 'ต่อ'}${res.team ? '<br>ภารกิจทีมรวม 900 นาทีสำเร็จ!' : ''}</p>
      <div class="row g8"><span class="pill coin">${coinSVG(16)} +${res.coins}</span>${res.salmon ? `<span class="pill salmon">🐟 +${res.salmon}</span>` : ''}</div>
      <button class="btn primary" style="width:100%" data-act="close">เยี่ยม!</button></div>`, 'ผลลีก'), 600);
    const rows = this.rows(), me = rows.findIndex(r => r.me), above = rows.slice(0, me).map(r => r.id);
    const passed = Array.isArray(st.ahead) ? above.filter(id => !st.ahead.includes(id)) : [];
    if (Array.isArray(st.ahead)){ if (passed.length && !res){ const r = rows.find(x => x.id === passed[0]), gap = r.min - rows[me].min + 1;
      toast(`${esc(r.name)} แซงคุณแล้ว! อีก ${gap} นาทีแซงกลับ`, 3000); } }
    st.ahead = above;
    const d = peek(today()), ex = effEx(d);
    if (ex >= 20 && st.cheerDay !== today()){ const r = seeded(today() + 'c'), b = BOTS[Math.floor(r() * BOTS.length)], c = cat();
      st.cheerDay = today(); c.happiness = clamp(c.happiness + 3, 0, 100); save();
      setTimeout(() => toast(`🐾 ${esc(b.name)}: ${esc(b.cheer[Math.floor(r() * b.cheer.length)])} (+3 ความสุข)`, 3200), res ? 2500 : 900); }
  },
  chat(rows){
    const me = rows.findIndex(r => r.me), r = seeded(today() + new Date().getHours()), out = [];
    const up = rows[me - 1], down = rows[me + 1];
    if (up && up.bot) out.push({b:up.bot, t:up.bot.tease[Math.floor(r() * up.bot.tease.length)]});
    if (down && down.bot) out.push({b:down.bot, t:down.bot.chase[Math.floor(r() * down.bot.chase.length)]});
    const ex = effEx(peek(today())), others = rows.filter((x, i) => x.bot && i !== me - 1 && i !== me + 1);

    return out;
  }
};

function attachLook(){
  const room = document.getElementById('room'); if (!room) return;
  room.addEventListener('pointermove', e => {
    if (Pet.busy || UI.petting) return; const s = Pet.svg(), w = document.getElementById('catwrap'); if (!s || !w) return;
    const c = w.getBoundingClientRect(), dx = clamp((e.clientX - (c.left + c.width / 2)) / 160, -1, 1), dy = clamp((e.clientY - (c.top + c.height * .4)) / 160, -1, 1);
    const look = s.querySelector('.c-look'), head = s.querySelector('.c-head');
    if (look) look.style.transform = `translate(${dx * 2.6}px,${dy * 2}px)`; if (head) head.style.transform = `rotate(${dx * 6}deg) translate(${dx * 2}px,${dy * 1.5}px)`;
  });
  room.addEventListener('pointerleave', () => { const s = Pet.svg(); if (!s) return; ['c-look','c-head'].forEach(c => { const el = s.querySelector('.' + c); if (el) el.style.transform = ''; }); });
}

let AC = null, purr = null;
function audioReady(){ if (!S || !S.settings.sound) return null; try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); return AC; } catch (e) { return null; } }
function purrStart(){
  if (purr || !AC || !S.settings.sound) return;
  try {
    const len = AC.sampleRate * 2, buf = AC.createBuffer(1, len, AC.sampleRate), ch = buf.getChannelData(0);
    let last = 0; for (let i = 0; i < len; i++){ const w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; ch[i] = last * 3.5; }
    const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 240;
    const am = AC.createGain(); am.gain.value = 0.5;
    const lfo = AC.createOscillator(); lfo.frequency.value = 25; const lg = AC.createGain(); lg.gain.value = 0.5; lfo.connect(lg); lg.connect(am.gain);
    const g = AC.createGain(); g.gain.value = 0;
    src.connect(lp); lp.connect(am); am.connect(g); g.connect(AC.destination);
    src.start(); lfo.start(); g.gain.linearRampToValueAtTime(0.5, AC.currentTime + 0.3);
    purr = {src, lfo, g};
  } catch (e) {}
}
function purrStop(){
  if (!purr || !AC) return; const p = purr; purr = null;
  try { p.g.gain.cancelScheduledValues(AC.currentTime); p.g.gain.setValueAtTime(p.g.gain.value, AC.currentTime); p.g.gain.linearRampToValueAtTime(0, AC.currentTime + 0.5);
    setTimeout(() => { try { p.src.stop(); p.lfo.stop(); } catch (e) {} }, 650); } catch (e) {}
}
function meow(){
  const ac = audioReady(); if (!ac) return;
  try { const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1100; f.Q.value = 1.2;
    o.type = 'sawtooth'; const t = ac.currentTime;
    o.frequency.setValueAtTime(520, t); o.frequency.linearRampToValueAtTime(880, t + 0.16); o.frequency.linearRampToValueAtTime(470, t + 0.42);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.18, t + 0.05); g.gain.linearRampToValueAtTime(0.12, t + 0.3); g.gain.linearRampToValueAtTime(0, t + 0.45);
    o.connect(f); f.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + 0.5); } catch (e) {}
}
function chime(){
  const ac = audioReady(); if (!ac) return;
  try { const t = ac.currentTime; [880, 1320].forEach((fr, i) => { const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = fr;
    g.gain.setValueAtTime(0, t + i * .09); g.gain.linearRampToValueAtTime(.12, t + i * .09 + .02); g.gain.exponentialRampToValueAtTime(.001, t + i * .09 + .35);
    o.connect(g); g.connect(ac.destination); o.start(t + i * .09); o.stop(t + i * .09 + .4); }); } catch (e) {}
}

const Store = {
  mode:'local', ref:null, writing:false, pending:false, timer:null,
  loadLocal(){ try { const t = localStorage.getItem(LS_KEY); return t ? JSON.parse(t) : null; } catch (e) { return null; } },
  saveLocal(){ try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {} },
  async connect(){
    try {
      if (!window.claude || typeof window.claude.use !== 'function') return null;
      const pair = await timeout(Promise.all([window.claude.use('db'), window.claude.use('user')]), 12000);
      const db = pair[0], user = pair[1];
      if (!db || !user) return null;
      const uid = await timeout(user.id(), 8000);
      if (!uid) return null;
      this.ref = db.doc('data/users/' + uid + '/meowmotion');
      const snap = await timeout(this.ref.get(), 10000);
      this.mode = 'cloud';
      if (snap && snap.exists){ const body = snap.data(); if (body && typeof body.json === 'string') return JSON.parse(body.json); }
      return {};
    } catch (e) { this.ref = null; this.mode = 'local'; return null; }
  },
  save(){ if (!S) return; S.savedAt = Date.now(); this.saveLocal(); clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 1500); },
  async flush(){
    if (!this.ref || !S) return;
    if (this.writing){ this.pending = true; return; }
    this.writing = true;
    try { await this.ref.set({v:1, savedAt:S.savedAt, json:JSON.stringify(S)}); }
    catch (e) { if (e && (e.code === 'invalid_argument' || e.code === 'revoked' || e.code === 'quota_exceeded')){ this.ref = null; this.mode = 'local'; } }
    this.writing = false;
    if (this.pending){ this.pending = false; this.flush(); }
  }
};
function save(){ prune(); Store.save(); }
function prune(){ const keep = addDays(today(), -180); Object.keys(S.days).forEach(k => { if (k < keep) delete S.days[k]; }); }
function migrate(st){
  if (!st || !Array.isArray(st.cats) || !st.cats.length) return null;
  const base = newState(st.cats[0].name);
  const out = Object.assign(base, st);
  out.settings = Object.assign(newState().settings, st.settings || {});
  out.inv = Object.assign({kibble:0, tuna:0}, st.inv || {});
  out.pet = st.pet || {day:today(), gained:0};
  Object.values(out.days).forEach(d => { const e = emptyDay(); Object.keys(e).forEach(k => { if (d[k] == null) d[k] = e[k]; }); });
  return out;
}

function attachPet(){
  const el = document.getElementById('catwrap'), room = document.getElementById('room'); if (!el) return;
  let down = false, dist = 0, lx = 0, ly = 0, moved = false, lastHeart = 0, pid = null;

function parseHealth(text){
  const raw = String(text || '').trim(); if (!raw) return null;
  try { const j = JSON.parse(raw); if (j && typeof j === 'object'){ const o = {}; ['steps','kcal','ex','stand','z2','wmin'].forEach(k => { const v = num(j[k]); if (v != null) o[k] = v; }); if (typeof j.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(j.date)) o.date = j.date; if (Object.keys(o).length) return o; } } catch (e) {}
  const t = raw.replace(/(\d),(\d{3})/g, '$1$2');
  const pick = re => { const m = t.match(re); return m ? num(m[1]) : null; };
  const o = {};
  const steps = pick(/(?:^|[^a-z])(?:steps?|ก้าว)\s*[=:]\s*([\d.]+)/i); if (steps != null) o.steps = steps;
  const kcal = pick(/(?:kcal|active\s*energy|energy|cal(?:ories)?|แคลอรี่?)\s*[=:]\s*([\d.]+)/i); if (kcal != null) o.kcal = kcal;
  const ex = pick(/(?:^|[^a-z])(?:exercise|ex|นาทีออกกำลัง(?:กาย)?)\s*[=:]\s*([\d.]+)/i); if (ex != null) o.ex = ex;
  const stand = pick(/(?:stand|ยืน)\s*[=:]\s*([\d.]+)/i); if (stand != null) o.stand = stand;
  const z2 = pick(/(?:z2|zone\s*2|zone2)\s*[=:]\s*([\d.]+)/i); if (z2 != null) o.z2 = z2;
  const wmin = pick(/(?:wmin|workout)\s*[=:]\s*([\d.]+)/i); if (wmin != null) o.wmin = wmin;
  const dt = t.match(/date\s*[=:]\s*(\d{4}-\d{2}-\d{2})/i); if (dt) o.date = dt[1];
  return Object.keys(o).length ? o : null;
}
function applyHealth(v){
  const k = v.date && v.date <= today() ? v.date : today(), d = day(k);
  ['steps','kcal','ex','stand'].forEach(f => { if (v[f] != null && isFinite(v[f])) d[f] = Math.max(0, Math.round(v[f])); });
  if (v.z2 != null || v.wmin != null){
    const z2 = Math.max(0, Math.round(v.z2 || 0)), min = Math.max(z2, Math.round(v.wmin != null ? v.wmin : z2));
    d.workouts = d.workouts.filter(w => w.id !== 'health-' + k);
    if (min > 0) d.workouts.push({id:'health-' + k, type:'workout', min, z2, src:'health', at:Date.now()});
  }
  d.syncedAt = Date.now();
  const r = award(k); save(); return r;
}

function wkPause(){
  const w = UI.walking; if (!w) return; const b = document.getElementById('wkPauseBtn');
  if (w.pausedAt){ w.pausedMs += Date.now() - w.pausedAt; w.pausedAt = 0; if (b) b.textContent = 'พัก'; const s = document.querySelector('#wkCat svg'); if (s){ s.dataset.eyes = 'happy'; s.dataset.mouth = 'open'; } }
  else { w.pausedAt = Date.now(); if (b) b.textContent = 'เล่นต่อ'; const s = document.querySelector('#wkCat svg'); if (s){ s.dataset.eyes = 'open'; s.dataset.mouth = 'w'; } }
  haptic(); wkTick();
}
function endWorkout(keep){
  const w = UI.walking; if (!w) return;
  clearInterval(w.timer); try { window.removeEventListener('devicemotion', w.handler); } catch (e) {}
  try { if (w.geo != null) navigator.geolocation.clearWatch(w.geo); } catch (e) {} try { if (w.wake) w.wake.release(); } catch (e) {}
  const n = wkNumbers(w); UI.walking = null; C3D.detach(); const el = document.getElementById('wk'); if (el) el.remove();
  if (ACTS[w.act].out && w.auto && w.fix) wPrefs().lastPlace[w.act] = w.place;
  if (!keep){ toast('ยกเลิกแล้ว'); save(); goTab('cat'); Pet.start(); return; }
  if (n.min < 1){ toast('ยังไม่ถึง 1 นาที เลยยังไม่บันทึกนะ'); goTab('cat'); Pet.start(); return; }
  const k = today(), d = day(k);
  d.workouts.push({id:'w' + Date.now(), type:w.act, min:n.min, z2:Math.min(n.brisk, n.min), src:w.motion ? 'motion' : 'timer', steps:w.steps, dist:Math.round(w.dist), place:w.place, at:Date.now()});
  if (w.steps) d.appSteps = (d.appSteps || 0) + w.steps;
  const r = award(k); save(); UI.happyUntil = Date.now() + 3000; goTab('cat');
  openSheet(`<div class="col g10" style="align-items:center;text-align:center"><div style="width:140px;height:140px">${catArt(cat().breed, 'happy', 'แมวดีใจ', 280)}</div>
    <h2>${esc(ACTS[w.act].name)} ${n.min} นาที!</h2>
    <span class="muted" style="font-size:14px">${w.dist > 50 ? (w.dist / 1000).toFixed(2) + ' กม. · ' : ''}${w.motion && w.steps ? fmt(w.steps) + ' ก้าว · ' : ''}ระดับปานกลางขึ้นไป ${Math.min(n.brisk, n.min)} นาที</span>
    <div class="row g8" style="justify-content:center;flex-wrap:wrap"><span class="pill coin">${coinSVG()}+${fmt(r.gotC)} Coins</span>${r.gotS ? `<span class="pill salmon">${fishSVG()}+${r.gotS} Salmon</span>` : ''}</div>
    <span class="small muted">${n.min < 10 ? 'ครบ 10 นาทีขึ้นไปจะได้โบนัส workout +10' : r.gotS ? 'ได้ Premium Salmon จากการอยู่ระดับปานกลางครบ 20 นาที' : 'ยิ่งอยู่ระดับปานกลางต่อเนื่อง ยิ่งได้โบนัส'}</span>
    <button class="btn lavb full" data-act="close">กลับไปหา ${esc(cat().name)}</button></div>`, 'สรุปการออกกำลังกาย');
  if (r.gotC || r.gotS){ chime(); haptic(); bumpCoins(); }
}

// ---------- actions ----------
const ACT = {
  botCheer(el){ const st = League.st(), b = BOTS.find(x => x.id === el.dataset.id); if (!b || st.sent[b.id] === today()) return;
    st.sent[b.id] = today(); save(); haptic();
    const r = seeded(b.id + today()), msg = b.cheer[Math.floor(r() * b.cheer.length)];
    toast(`🐟 → ${esc(b.cat)} · ${esc(b.name)}: "${esc(msg)}"`, 2800); render(); },
  close(){ closeSheet(); },
  start(){ const name = ($('#onbName') && $('#onbName').value.trim()) || 'Mochi'; S = newState(name.slice(0, 20)); Store.save(); goTab('cat'); haptic(); toast(`${esc(name)} มาอยู่บ้านแล้ว! ${coinSVG(16)} +50`); },
  feed(){ feedSheet(); }, play(){ playSheet(); },
  feedNow(el){ feedNow(el.dataset.id); }, playNow(el){ playNow(el.dataset.id); },
  goshop(el){ closeSheet(); UI.shopCat = el.dataset.v || 'food'; goTab('shop'); },
  walk(){ workoutSheet(); }, wstart(){ startWorkout(); }, wpause(){ wkPause(); }, wend(){ endWorkout(true); },
  wpick(el){ const p = wPrefs(); p[el.dataset.k] = el.dataset.v; save(); workoutSheet(); },
  wint(){ const w = UI.walking; if (!w) return; const i = INTERVALS.findIndex(x => x[0] === w.interval); w.interval = INTERVALS[(i + 1) % INTERVALS.length][0]; wPrefs().interval = w.interval;
    const curMin = Math.floor(wkElapsed(w) / 60000); w.fired = 0;
    if (w.interval === 'auto'){ const left = Math.max(10, S.settings.exGoal - effEx(peek(today()))); w.marks = [.25,.5,.75,1].map(f => curMin + Math.max(1, Math.round(left * f))); w.markText = ['ไปได้ 1 ใน 4 แล้ว!','ครึ่งทางเป้าวันนี้แล้ว!','อีกนิดเดียว เหลือ 1 ใน 4!','ครบเป้า Exercise วันนี้แล้ว!']; }
    else if (w.interval === 'off') w.marks = [];
    else { const n = Number(w.interval); w.marks = Array.from({length:24}, (_, j) => (Math.floor(curMin / n) + j + 1) * n); }
    wkChips(w); haptic(); save(); },
  sync(){ syncSheet(); }, guide(){ guideSheet(); },
  synctab(el){ UI.syncTab = el.dataset.v; syncSheet(); },
  importPaste(){ const v = parseHealth($('#pasteBox') && $('#pasteBox').value); if (!v){ toast('อ่านข้อมูลไม่ออก ลองวางข้อความจาก Shortcut อีกครั้ง'); return; } const r = applyHealth(v); closeSheet(); render(); announce(r); },
  saveManual(){
    const v = {steps:num($('#mSteps').value), kcal:num($('#mKcal').value), ex:num($('#mEx').value), stand:num($('#mStand').value)};
    const wm = num($('#wMin').value), wz = num($('#wZ2').value);
    if (v.stand != null) v.stand = clamp(v.stand, 0, 24);
    const k = today(), d = day(k);
    if (wm && wm > 0) d.workouts.push({id:'m' + Date.now(), type:'workout', min:Math.round(wm), z2:Math.round(clamp(wz || 0, 0, wm)), src:'manual', at:Date.now()});
    const r = applyHealth(v); closeSheet(); render(); announce(r);
  },
  range(el){ UI.range = el.dataset.v; render(); },
  shopcat(el){ UI.shopCat = el.dataset.v; render(); },
  buy(el){ buySheet(el.dataset.id); }, confirmBuy(el){ confirmBuy(el.dataset.id); },
  equip(el){ const c = cat(); c.collar = el.dataset.id || null; save(); render(); haptic(); },
  setcat(el){ S.activeCat = el.dataset.id; save(); render(); haptic(); toast(`${esc(cat().name)} มาอยู่บ้านแล้ว`); },
  adopt(el){ const k = el.dataset.v, b = BREEDS[k]; if (!b || levelInfo().level < b.lv) return;
    openSheet(`<div class="col g10" style="align-items:center;text-align:center"><div style="width:130px;height:130px">${catArt(k, 'happy', b.name, 260)}</div><h2>รับเลี้ยง${b.name}</h2>
      <div class="field" style="width:100%;text-align:left"><label for="adoptName">ตั้งชื่อ</label><input class="input" id="adoptName" maxlength="20" placeholder="เช่น Tofu" autocomplete="off"></div>
      <div class="row g10" style="width:100%"><button class="btn ghost grow" data-act="close">ยกเลิก</button><button class="btn primary grow" data-act="adoptOk" data-v="${k}">รับเลี้ยง</button></div></div>`, 'รับเลี้ยงแมว'); },
  adoptOk(el){ const k = el.dataset.v, name = ($('#adoptName').value.trim() || BREEDS[k].name).slice(0, 20), id = 'c' + Date.now();
    S.cats.push({id, name, breed:k, fullness:80, happiness:80, lastSim:Date.now(), collar:null, adopted:today()}); S.activeCat = id;
    save(); closeSheet(); render(); chime(); toast(`ยินดีต้อนรับ ${esc(name)}!`); },
  export(){
    const txt = JSON.stringify(S);
    const done = () => toast('คัดลอกข้อมูลสำรองแล้ว เก็บไว้ในโน้ตได้เลย');
    const fallback = () => openSheet(`<h2>ข้อมูลสำรอง</h2><p class="small muted" style="margin:0 0 10px">กดค้างเพื่อเลือกทั้งหมดแล้วคัดลอก</p><textarea class="input" style="height:200px;font-size:12px" readonly>${esc(txt)}</textarea><button class="btn lavb full" style="margin-top:12px" data-act="close">เสร็จ</button>`, 'ข้อมูลสำรอง');
    try { navigator.clipboard.writeText(txt).then(done, fallback); } catch (e) { fallback(); }
  },
  import(){ openSheet(`<h2>นำเข้าข้อมูลสำรอง</h2><p class="small muted" style="margin:0 0 10px">วางข้อความที่คัดลอกไว้ ข้อมูลปัจจุบันจะถูกแทนที่</p><textarea class="input" id="importBox" style="height:160px;font-size:12px" autocomplete="off" spellcheck="false"></textarea>
    <div class="row g10" style="margin-top:12px"><button class="btn ghost grow" data-act="close">ยกเลิก</button><button class="btn primary grow" data-act="importOk">นำเข้า</button></div>`, 'นำเข้าข้อมูล'); },
  importOk(){ let st = null; try { st = migrate(JSON.parse($('#importBox').value)); } catch (e) {} if (!st){ toast('ข้อมูลไม่ถูกต้อง'); return; } S = st; save(); closeSheet(); render(); toast('นำเข้าข้อมูลแล้ว'); },
  reset(){ confirmSheet('เริ่มใหม่ทั้งหมด?', 'แมว เหรียญ ของในกระเป๋า และสถิติทั้งหมดจะถูกลบ แนะนำให้คัดลอกข้อมูลสำรองก่อน', 'ลบและเริ่มใหม่', 'resetOk'); },
  resetOk(){ closeSheet(); S = null; try { localStorage.removeItem(LS_KEY); } catch (e) {} UI.booted = true; render(); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (fn){ e.preventDefault(); fn(el, e); }
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-set]'); if (!el || !S) return;
  const k = el.dataset.set, st = S.settings;
  if (k === 'catName'){ const v = el.value.trim().slice(0, 20); if (v){ cat().name = v; save(); toast('เปลี่ยนชื่อแล้ว'); } else el.value = cat().name; return; }
  if (k === 'sound' || k === 'gentle' || k === 'cat3d'){ st[k] = el.checked; if (k === 'cat3d') UI.c3dLost = false; save(); haptic(); return; }
  const lim = {moveGoal:[50,3000], exGoal:[5,300], standGoal:[1,24], age:[10,100]}[k];
  const v = num(el.value); if (v == null || !lim){ el.value = st[k]; return; }
  st[k] = Math.round(clamp(v, lim[0], lim[1])); el.value = st[k];
  award(today()); save(); render();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.getElementById('sheetBack')) closeSheet(); });

// ---------- routing ----------
function route(){
  const h = (location.hash || '').replace('#','');
  UI.tab = TABS.includes(h) ? h : 'cat';
  closeSheet(); render(); window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
function goTab(name){ UI.tab = name; try { history.replaceState(null, '', '#' + name); } catch (e) {} render(); window.scrollTo(0, 0); }

// ---------- boot ----------
function urlImport(){
  try {
    if (!location.search) return;
    const p = new URLSearchParams(location.search), o = {};
    ['steps','kcal','ex','stand','z2','wmin'].forEach(k => { const v = num(p.get(k)); if (v != null) o[k] = v; });
    const dt = p.get('date'); if (dt && /^\d{4}-\d{2}-\d{2}$/.test(dt)) o.date = dt;
    if (Object.keys(o).length && S){ const r = applyHealth(o); setTimeout(() => announce(r), 500); try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) {} }
  } catch (e) {}
}
function tick(){
  if (!S) return;
  simulateAll(); Store.saveLocal();
  if (UI.tab === 'cat' && !UI.petting && !UI.walking && !Pet.busy && !document.getElementById('sheetBack')){ refreshBars(); refreshCat(); }
}
const BOOT_AT = Date.now();
async function boot(){
  const local = migrate(Store.loadLocal());
  if (local){ S = local; UI.booted = true; simulateAll(); }
  route();
  if (S) urlImport();
  if (!S) setTimeout(() => { if (!S && !UI.booted){ UI.booted = true; render(); } }, 4000);
  const cloud = await Store.connect();
  if (cloud && cloud.cats){
    const c = migrate(cloud);
    const freshHere = S && S.created >= BOOT_AT;
    if (c && (!S || freshHere || (c.savedAt || 0) > (S.savedAt || 0))){ S = c; simulateAll(); Store.saveLocal(); if (!UI.walking){ closeSheet(); render(); } if (freshHere) toast('พบข้อมูลเดิมในบัญชีของคุณ โหลดกลับมาแล้ว'); }
    else if (S) Store.flush();
  } else if (cloud && S){ Store.flush(); }
  if (!UI.booted){ UI.booted = true; if (!S) render(); }
  if (UI.tab === 'me' && S) render();
  setInterval(tick, 30000);
  if (S) setTimeout(() => League.check(), 1500);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') tick(); else if (S){ Store.saveLocal(); Store.flush(); } });
}
boot();
</script>
