<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MeowMotion">
<meta name="theme-color" content="#F4F3F8">
<title>MeowMotion</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F4F3F8;--surface:#FFFFFF;--ink:#26242E;--ink2:#625F70;
  --mint:#CDEFE0;--mintD:#1B6E4E;--mintM:#5CC99B;
  --peach:#FFE0CC;--peachD:#A44A24;--peachM:#F4A27C;
  --lav:#E6E0FA;--lavD:#5B4BB8;--lavM:#9C8CF0;
  --honey:#FFF0C7;--honeyD:#8A5A00;
  --move:#EE5D5D;--ex:#23A272;--stand:#2F94D0;
  --raise:6px 6px 16px rgba(120,110,150,.14),-6px -6px 14px #FFFFFF;
  --raise-btn:5px 5px 12px rgba(120,110,150,.22),-5px -5px 12px #FFFFFF;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito','IBM Plex Sans Thai Looped',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0}
.app{max-width:480px;margin:0 auto;padding:max(20px,env(safe-area-inset-top)) 20px calc(96px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px}
.title{font-size:26px;line-height:32px;font-weight:800;letter-spacing:-.3px}
.sub{font-size:13px;color:var(--ink2)}
.row{display:flex;align-items:center}.col{display:flex;flex-direction:column}
.g4{gap:4px}.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}
.between{justify-content:space-between}.grow{flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
.chip.lav{color:var(--lavD);background:var(--lav)}.chip.mint{color:var(--mintD);background:var(--mint)}.chip.peach{color:var(--peachD);background:var(--peach)}.chip.honey{color:var(--honeyD);background:var(--honey)}
.pills{display:flex;gap:8px;flex-shrink:0}
.pill{display:flex;align-items:center;gap:6px;font-weight:800;font-size:15px;padding:7px 12px 7px 8px;border-radius:999px;white-space:nowrap;transition:transform .3s}
.pill.coin{background:var(--honey);color:var(--honeyD)}.pill.salmon{background:var(--peach);color:var(--peachD)}
.pill.bump{animation:bump .5s}
.card{background:var(--surface);border-radius:22px;padding:14px 16px;box-shadow:var(--raise)}
.muted{color:var(--ink2)}.small{font-size:12px}.tiny{font-size:11.5px}
.bars{display:flex;flex-direction:column;gap:8px}
.barrow{display:grid;grid-template-columns:22px 62px minmax(0,1fr) 42px;align-items:center;gap:8px;height:20px}
.barrow .lbl{font-size:13px;font-weight:600}.barrow .val{font-size:13px;font-weight:800;text-align:right}
.track{height:8px;border-radius:999px;background:#F1EEF6;overflow:hidden}
.fill{height:100%;border-radius:999px;transition:width .7s cubic-bezier(.34,1.56,.64,1)}
.room{position:relative;height:252px;flex-shrink:0;border-radius:28px;overflow:hidden;background:#EDE8FB;touch-action:none;user-select:none;-webkit-user-select:none}
.floor{position:absolute;left:0;right:0;bottom:0;height:80px;background:#F9E3D3;border-top:3px solid #F3D2BC}
.window{position:absolute;left:18px;top:18px;width:84px;height:76px;border-radius:16px;background:#D6EEF8;border:5px solid #fff;overflow:hidden}
.window.night{background:#4A4470}
.window:before,.window:after{content:"";position:absolute;background:#fff}
.window:before{left:50%;top:0;bottom:0;width:4px;margin-left:-2px}.window:after{top:50%;left:0;right:0;height:4px;margin-top:-2px}
.sun{position:absolute;left:8px;top:8px;width:16px;height:16px;border-radius:50%;background:#FFE7A3}
.window.night .sun{background:#F3EFD8;box-shadow:inset -4px -2px 0 #4A4470}
.cushion{position:absolute;left:50%;bottom:36px;width:184px;height:42px;margin-left:-92px;border-radius:50%;background:#C9BCF5}
.catwrap{position:absolute;left:50%;bottom:46px;width:156px;height:156px;margin-left:-78px;cursor:grab;touch-action:none}
.catwrap svg{width:100%;height:100%;overflow:visible}
.room.live{height:min(420px,56vh);min-height:330px;background:#E9DCCB}
.room.live .lv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;opacity:0;transition:opacity .7s ease;pointer-events:none}
.room.live .lv.on{opacity:1}
.room.live .lv-shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,0) 26%,rgba(0,0,0,0) 70%,rgba(0,0,0,.22))}
.room.live .catwrap{left:14%;right:14%;top:16%;bottom:12%;width:auto;height:auto;margin:0;border-radius:40%}
.room.live .bubble{top:auto;bottom:44px;background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border:1px solid rgba(255,255,255,.8)}
.room.live .hint{background:rgba(255,255,255,.66);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.lvtag{position:absolute;left:12px;top:12px;font-size:11px;font-weight:800;letter-spacing:.04em;color:#26242E;background:rgba(255,255,255,.66);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding:4px 9px;border-radius:999px;pointer-events:none}
.bubble{position:absolute;right:14px;top:14px;max-width:62%;background:#fff;border-radius:16px;padding:7px 12px;font-size:13px;font-weight:700;box-shadow:0 4px 12px rgba(120,110,150,.16);animation:pop .35s cubic-bezier(.34,1.56,.64,1)}
.hint{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);white-space:nowrap;font-size:12px;font-weight:600;color:var(--ink2);background:rgba(255,255,255,.78);padding:3px 10px;border-radius:999px}
.decor{position:absolute;pointer-events:none}
.heart{position:absolute;width:18px;height:18px;pointer-events:none;animation:float 1.1s ease-out forwards}
.cat .c-body{transform-box:view-box;transform-origin:100px 192px;animation:breathe 3.4s ease-in-out infinite}
.cat.slow .c-body{animation-duration:5.6s}
.cat .c-head{transform-box:view-box;transform-origin:100px 118px}
.cat .c-earL{transform-box:view-box;transform-origin:70px 62px}
.cat .c-earR{transform-box:view-box;transform-origin:130px 62px}
.cat .c-eyes{transform-box:view-box;transform-origin:100px 80px}
.cat .c-look{transform-box:view-box}
.cat .c-pawL{transform-box:view-box;transform-origin:80px 186px}
.cat .c-pawR{transform-box:view-box;transform-origin:120px 186px}
.cat .c-whisk{transform-box:view-box;transform-origin:100px 96px}
.cat .e-open,.cat .e-happy,.cat .e-closed,.cat .m-w,.cat .m-open,.cat .m-o,.cat .m-down,.cat .m-yawn{display:none}
.cat[data-eyes=open] .e-open,.cat[data-eyes=happy] .e-happy,.cat[data-eyes=closed] .e-closed{display:inline}
.cat[data-mouth=w] .m-w,.cat[data-mouth=open] .m-open,.cat[data-mouth=o] .m-o,.cat[data-mouth=down] .m-down,.cat[data-mouth=yawn] .m-yawn{display:inline}
.cat.hop{animation:hop .5s cubic-bezier(.34,1.56,.64,1)}
.cat.wiggle{animation:wiggle .5s ease-in-out 2}
.catwrap{will-change:transform}
.zzz{position:absolute;font-weight:800;color:#5B4BB8;pointer-events:none;animation:zzf 2.4s ease-out forwards}
@keyframes zzf{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(14px,-40px)}}
/* ---- live workout companion ---- */
.wk{position:fixed;inset:0;z-index:50;background:#1E1D26;overflow:hidden;animation:fade .25s;user-select:none;-webkit-user-select:none}
.wk-scene{position:absolute;left:0;right:0;top:0;height:72%;overflow:hidden;transition:filter 1.2s}
.wkv{position:absolute;inset:0;opacity:0;transition:opacity .6s,filter 1.2s;pointer-events:none}
.wkv video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%;opacity:0;transition:opacity .7s ease}
.wkv video.on{opacity:1}
.wk-scene.has-video .wkv{opacity:1}
.wk-scene.has-video .layer,.wk-scene.has-video .wk-cat,.wk-scene.has-video .stars,.wk-scene.has-video .sunmoon{visibility:hidden}
.wk-scene.has-video:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.22),rgba(0,0,0,0) 25%,rgba(0,0,0,0) 75%,rgba(0,0,0,.18))}
.wk-scene[data-sky=dawn] .wkv{filter:sepia(.18) saturate(1.05) brightness(1.02)}
.wk-scene[data-sky=golden] .wkv{filter:sepia(.32) saturate(1.2) hue-rotate(-8deg)}
.wk-scene[data-sky=night] .wkv{filter:brightness(.62) saturate(.75) hue-rotate(12deg)}
.wk-scene[data-wx=cloud] .wkv,.wk-scene[data-wx=rain] .wkv{filter:brightness(.85) saturate(.6)}
.wk-scene .sky{position:absolute;inset:0;transition:background 1.5s}
.wk-scene[data-sky=dawn] .sky{background:linear-gradient(#B9D7F2,#FDD9B5)}
.wk-scene[data-sky=day] .sky{background:linear-gradient(#8FCBF2,#DDF1FB)}
.wk-scene[data-sky=golden] .sky{background:linear-gradient(#F4B37A,#F9DDB0)}
.wk-scene[data-sky=night] .sky{background:linear-gradient(#1C2141,#3B3F6B)}
.wk-scene[data-wx=cloud] .sky,.wk-scene[data-wx=rain] .sky{filter:saturate(.45) brightness(.92)}
.sunmoon{position:absolute;width:46px;height:46px;border-radius:50%;background:#FFE7A3;box-shadow:0 0 40px 10px rgba(255,231,163,.55);transition:all 1.5s}
.wk-scene[data-sky=dawn] .sunmoon{left:14%;top:30%}.wk-scene[data-sky=day] .sunmoon{left:70%;top:8%}.wk-scene[data-sky=golden] .sunmoon{left:78%;top:26%;background:#FFC879}
.wk-scene[data-sky=night] .sunmoon{left:74%;top:10%;background:#F3EFD8;box-shadow:inset -10px -4px 0 #3B3F6B,0 0 24px rgba(243,239,216,.4)}
.wk-scene[data-wx=rain] .sunmoon,.wk-scene[data-wx=cloud] .sunmoon{opacity:.25}
.stars{position:absolute;inset:0 0 50% 0;opacity:0;transition:opacity 1.5s;background-image:radial-gradient(1.5px 1.5px at 20% 30%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 60% 18%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 82% 40%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 38% 12%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 90% 8%,#fff 50%,transparent 51%)}
.wk-scene[data-sky=night] .stars{opacity:1}
.layer{position:absolute;inset:0;transition:opacity 1.2s}
.wk-scene[data-place=indoor] .out,.wk-scene[data-place=outdoor] .in{opacity:0;pointer-events:none}
.hills{position:absolute;left:-10%;right:-10%;top:40%;height:20%;background:radial-gradient(60% 100% at 25% 100%,#86C58C 99%,transparent 100%),radial-gradient(55% 90% at 78% 100%,#7BBF86 99%,transparent 100%)}
.ground{position:absolute;left:0;right:0;bottom:0;height:52%;background:#A6D89E}
.wk-scene[data-sky=night] .ground,.wk-scene[data-sky=night] .hills{filter:brightness(.55) saturate(.7)}
.path{position:absolute;left:50%;bottom:-2%;width:150%;height:56%;margin-left:-75%;transform:perspective(260px) rotateX(58deg);transform-origin:50% 100%;background-color:#E9D9BE;background-image:linear-gradient(90deg,transparent 48.6%,rgba(255,255,255,.95) 48.6%,rgba(255,255,255,.95) 51.4%,transparent 51.4%);background-size:100% 90px}
.wk-scene[data-sky=night] .path{filter:brightness(.6)}
.tree{position:absolute;left:50%;top:44%;width:90px;height:110px;margin-left:-45px;transform-origin:50% 100%;opacity:0}
.wall{position:absolute;inset:0;background:#EDE8FB}
.wk-scene[data-sky=night] .wall{background:#D9D1F2}
.ifloor{position:absolute;left:0;right:0;bottom:0;height:34%;background:#F9E3D3;border-top:4px solid #F3D2BC}
.iwin{position:absolute;left:8%;top:9%;width:34%;max-width:170px;aspect-ratio:1.1;border-radius:18px;border:7px solid #fff;overflow:hidden}
.iwin .isky{position:absolute;inset:0}
.wk-scene[data-sky=dawn] .isky{background:linear-gradient(#B9D7F2,#FDD9B5)}.wk-scene[data-sky=day] .isky{background:linear-gradient(#8FCBF2,#DDF1FB)}
.wk-scene[data-sky=golden] .isky{background:linear-gradient(#F4B37A,#F9DDB0)}.wk-scene[data-sky=night] .isky{background:linear-gradient(#1C2141,#3B3F6B)}
.iwin:before,.iwin:after{content:"";position:absolute;background:#fff;z-index:2}.iwin:before{left:50%;top:0;bottom:0;width:6px;margin-left:-3px}.iwin:after{top:50%;left:0;right:0;height:6px;margin-top:-3px}
.lamp{position:absolute;right:10%;top:0;width:70px;height:120px;opacity:0;transition:opacity 1.2s}
.wk-scene[data-sky=night] .lamp,.wk-scene[data-sky=golden] .lamp{opacity:1}
.belt{position:absolute;left:50%;bottom:7%;width:min(62%,300px);height:44px;transform:translateX(-50%);border-radius:14px;background-color:#4A4658;background-image:repeating-linear-gradient(90deg,#4A4658 0 18px,#5A566A 18px 22px);box-shadow:0 6px 0 #34313F}
.mat{position:absolute;left:50%;bottom:8%;width:min(78%,360px);height:34px;transform:translateX(-50%) perspective(200px) rotateX(40deg);border-radius:10px;background:#9C8CF0}
.post{position:absolute;right:9%;bottom:16%;width:64px}
.rain,.irain{position:absolute;inset:0;opacity:0;pointer-events:none;background-image:repeating-linear-gradient(105deg,transparent 0 9px,rgba(255,255,255,.55) 9px 10px,transparent 10px 23px);background-size:60px 60px;animation:rainfall .45s linear infinite}
.wk-scene[data-wx=rain][data-place=outdoor] .rain,.wk-scene[data-wx=rain] .irain{opacity:1}
@keyframes rainfall{to{background-position:-14px 60px}}
.wk-cat{position:absolute;left:50%;bottom:8%;width:min(46vw,220px);aspect-ratio:1;margin-left:calc(min(46vw,220px) / -2);transform-origin:50% 100%;z-index:3}
.wk-scene[data-place=indoor][data-act=yoga] .wk-cat,.wk-scene[data-place=indoor][data-act=strength] .wk-cat{bottom:11%}
.wk-cat svg{width:100%;height:100%;overflow:visible}
.wk-top{position:absolute;left:0;right:0;top:0;padding:max(14px,env(safe-area-inset-top)) 14px 0;display:flex;gap:6px;flex-wrap:wrap;z-index:5}
.wchip{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 11px;border-radius:999px;border:none;font:inherit;font-size:12.5px;font-weight:800;color:#26242E;background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);white-space:nowrap}
button.wchip{cursor:pointer}
.wk-pop{position:absolute;left:50%;top:calc(max(14px,env(safe-area-inset-top)) + 52px);transform:translate(-50%,-20px);opacity:0;z-index:6;background:#fff;color:#26242E;border-radius:20px;padding:12px 16px;font-weight:800;font-size:16px;box-shadow:0 12px 30px rgba(38,36,46,.25);text-align:center;transition:all .45s cubic-bezier(.34,1.4,.64,1);width:max-content;min-width:250px;max-width:86vw}
.wk-pop.show{opacity:1;transform:translate(-50%,0)}
.wk-pop small{display:block;font-size:12.5px;font-weight:700;color:#625F70;margin-top:2px}
.fx{position:absolute;width:24px;height:24px;pointer-events:none;z-index:4;animation:fxup 2.2s ease-out forwards}
@keyframes fxup{0%{opacity:0;transform:translate(0,0) scale(.6)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx,10px),-120px) scale(1.2)}}
.wk-dash{position:absolute;left:0;right:0;bottom:0;height:calc(28% + 28px);min-height:262px;margin-top:-28px;border-radius:28px 28px 0 0;background:rgba(255,255,255,.66);-webkit-backdrop-filter:blur(26px) saturate(1.4);backdrop-filter:blur(26px) saturate(1.4);padding:14px 18px calc(14px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;color:#26242E;z-index:7;box-shadow:0 -10px 30px rgba(30,28,40,.12)}
.wk.night .wk-dash{background:rgba(30,28,44,.66);color:#fff}
.wk.night .wk-dash .muted2{color:rgba(255,255,255,.78)}
.muted2{color:#625F70}
.wk-dash .big{font-size:46px;line-height:48px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.wk-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.wk-metrics div{display:flex;flex-direction:column}
.wk-metrics b{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.wk-metrics span{font-size:11.5px;font-weight:700}
.zbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.zbar div{height:26px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;background:rgba(120,110,150,.16);color:inherit;opacity:.6;transition:all .4s}
.zbar div.on{opacity:1;color:#fff}
.zbar div.on.z1{background:#2F94D0}.zbar div.on.z2{background:#23A272}.zbar div.on.z3{background:#E8845A}
.wk-ctrl{display:flex;gap:10px;margin-top:auto}
.wk-ctrl .btn{flex:1;min-height:50px;font-size:15.5px}
.wk.night .btn.ghost{background:rgba(255,255,255,.14);color:#fff;border-color:transparent}
.talkchip[hidden]{display:none}
.talkchip{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:700;cursor:pointer}
.talkchip input{width:22px;height:22px;accent-color:#23A272;flex-shrink:0}
.pickgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pickgrid button,.pickrow button{border:1.5px solid #E2DEEC;background:#fff;border-radius:16px;font:inherit;font-weight:800;font-size:14px;color:#26242E;cursor:pointer}
.pickgrid button{min-height:58px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:6px 12px;text-align:left}
.pickgrid button small{font-size:11.5px;font-weight:600;color:#625F70}
.pickrow{display:flex;gap:6px;flex-wrap:wrap}
.pickrow button{min-height:40px;padding:0 13px}
.pickgrid button.on,.pickrow button.on{border-color:#5B4BB8;background:#E6E0FA;color:#5B4BB8}
.lbl2{font-size:13px;font-weight:800;color:#625F70;margin:14px 0 6px}

.ringsrow{display:flex;align-items:center;gap:16px}
.metric{display:flex;align-items:baseline;justify-content:space-between}
.metric b{font-size:17px;font-weight:800}.metric span.u{font-size:13px;font-weight:600;color:var(--ink2)}
.divider{height:1px;background:#EEEAF4}
.btn{min-height:44px;border:none;border-radius:16px;font-weight:800;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 16px;cursor:pointer;white-space:nowrap;text-decoration:none;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.primary{background:var(--peachD);color:#fff;box-shadow:0 6px 14px rgba(164,74,36,.28)}
.btn.lavb{background:var(--lavD);color:#fff}
.btn.soft{background:var(--bg);color:var(--ink);border:1px solid rgba(38,36,46,.06);box-shadow:var(--raise-btn)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid rgba(38,36,46,.08)}
.btn.honeyb{background:var(--honey);color:var(--honeyD)}
.btn.outline{background:#fff;color:var(--honeyD);border:1.5px solid #F2D27A}
.btn.full{width:100%}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.quick .btn{height:60px;border-radius:18px;font-size:14px;gap:6px;padding:0 8px}
.ico{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.banner{display:flex;align-items:center;gap:12px;background:#fff;border-radius:20px;padding:10px 12px 10px 14px;box-shadow:var(--raise);animation:pop .4s}
.banner p{margin:0;font-size:13.5px;font-weight:700;flex:1}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px 12px env(safe-area-inset-bottom);background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid #ECE9F2}
.tabbar .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));height:56px}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:var(--ink2);font-size:11px;font-weight:700}

<script>
'use strict';
/* =========================================================
   MeowMotion — exercise to feed your cat
   ========================================================= */

// ---------- constants ----------
const BREEDS = {
  orange:    {name:'แมวส้ม', lv:1, body:'#F7B577', stripe:'#E8924A', belly:'#FFF1E3', ear:'#FFC6BE', tail:'#F0A060', eyes:['#2B2A33','#2B2A33']},
  siamese:   {name:'วิเชียรมาศ', lv:3, body:'#F3E6D3', stripe:null, belly:'#FBF4EA', ear:'#B98C7C', tail:'#6B4A3A', point:'#6B4A3A', eyes:['#3E7CC9','#3E7CC9']},
  fold:      {name:'สก็อตติชโฟลด์', lv:5, body:'#C9C3C9', stripe:'#A79FA8', belly:'#F2EEF1', ear:'#E9C4C4', tail:'#B8B1B9', eyes:['#C98A0B','#C98A0B'], folded:true},
  korat:     {name:'โคราช (สีสวาด)', lv:8, body:'#A9B4C2', stripe:null, belly:'#C3CCD7', ear:'#D9B8BE', tail:'#9AA6B5', eyes:['#3F9A5E','#3F9A5E']},
  mainecoon: {name:'เมนคูน', lv:12, body:'#B88A5E', stripe:'#7E5A3A', belly:'#F2E3D0', ear:'#E9B9A6', tail:'#A57A50', eyes:['#7AA33E','#7AA33E'], tufts:true},
  khaomanee: {name:'ขาวมณี', lv:15, body:'#FFFFFF', stripe:null, belly:'#F6F4F9', ear:'#FFC6BE', tail:'#FFFFFF', eyes:['#3E7CC9','#D9A520'], outline:'#DCD6E6'}
};
const BREED_ORDER = ['orange','siamese','fold','korat','mainecoon','khaomanee'];
const FOOD = {
  kibble:{name:'Kibble', full:20, happy:2},
  tuna:{name:'Tuna', full:35, happy:10},
  salmon:{name:'Premium Salmon', full:50, happy:25}
};
const SHOP = [
  {id:'kibble', cat:'food', name:'Kibble', price:15, lv:1, desc:'+20 อิ่ม · +2 สุข', bg:'#FFF0E6'},
  {id:'tuna', cat:'food', name:'Tuna', price:40, lv:1, desc:'+35 อิ่ม · +10 สุข', bg:'#E6F2FA'},
  {id:'salmon', cat:'food', name:'Premium Salmon', price:150, lv:1, desc:'+50 อิ่ม · +25 สุข · XP ×2 24 ชม.', bg:'#FFE0CC'},
  {id:'yarn', cat:'toy', name:'ลูกบอลไหมพรม', price:60, lv:1, desc:'เล่นได้ +8 สุข ทุก 2 ชม.', play:8, bg:'#EFEBFB'},
  {id:'mouse', cat:'toy', name:'หนูของเล่น', price:90, lv:2, desc:'เล่นได้ +10 สุข ทุก 2 ชม.', play:10, bg:'#F1EEF6'},
  {id:'wand', cat:'toy', name:'ไม้ตกแมว', price:120, lv:3, desc:'เล่นได้ +12 สุข ทุก 2 ชม.', play:12, bg:'#FCE8EE'},
  {id:'collar_lav', cat:'collar', name:'ปลอกคอลาเวนเดอร์', price:80, lv:1, desc:'ของตกแต่ง · +5 สุข', color:'#9C8CF0', bg:'#EFEBFB'},
  {id:'collar_mint', cat:'collar', name:'ปลอกคอมินต์', price:100, lv:2, desc:'ของตกแต่ง · +5 สุข', color:'#5CC99B', bg:'#E8F6EF'},
  {id:'collar_star', cat:'collar', name:'ปลอกคอดาว', price:160, lv:5, desc:'ของตกแต่ง · +5 สุข', color:'#F6C453', star:true, bg:'#FFF6DA'},
  {id:'plant', cat:'room', name:'กระถางต้นไม้', price:120, lv:1, desc:'แต่งห้อง · +5 สุข', bg:'#E8F6EF'},
  {id:'rug', cat:'room', name:'พรมวงกลม', price:200, lv:2, desc:'แต่งห้อง · +5 สุข', bg:'#FDEBDD'},
  {id:'frame', cat:'room', name:'กรอบรูปปลา', price:150, lv:3, desc:'แต่งห้อง · +5 สุข', bg:'#E6F2FA'},
  {id:'condo', cat:'room', name:'คอนโดแมว', price:1280, lv:4, desc:'แต่งห้อง · +5 สุข', bg:'#E8F6EF'},
  {id:'fishbowl', cat:'room', name:'ตู้ปลา', price:600, lv:6, desc:'แต่งห้อง · +5 สุข', bg:'#E6F2FA'}
];
const SHOP_BY = Object.fromEntries(SHOP.map(i => [i.id, i]));
const SHOP_CATS = [['all','ทั้งหมด'],['food','อาหาร'],['toy','ของเล่น'],['collar','ปลอกคอ'],['room','แต่งห้อง']];
const TABS = ['cat','stats','friends','shop','me'];
const LS_KEY = 'meowmotion.v1';
const TOY_CD = 2 * 3600e3;
const DAY_TH = ['อา','จ','อ','พ','พฤ','ศ','ส'];

// ---------- state ----------
let S = null;
const UI = {tab:'cat', range:'week', shopCat:'all', syncTab:'shortcut', walking:null, petting:false, happyUntil:0, eatingUntil:0, booted:false, cloudTried:false};

// ---------- utils ----------
const $ = s => document.querySelector(s);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const fmt = n => Math.round(n).toLocaleString('en-US');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function keyOf(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
const today = () => keyOf(new Date());
function keyToDate(k){ const p = k.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function addDays(k, n){ const d = keyToDate(k); d.setDate(d.getDate()+n); return keyOf(d); }
function daysBetween(a, b){ return Math.round((keyToDate(b) - keyToDate(a)) / 864e5); }
function timeTH(ts){ const d = new Date(ts); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function num(v){ if (v === '' || v == null) return null; const n = Number(String(v).replace(/,/g,'').trim()); return isFinite(n) ? n : null; }
function timeout(p, ms){ return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]); }

function newState(name){
  const now = Date.now();
  return {
    v:1, created:now, savedAt:now,
    activeCat:'c1',
    cats:[{id:'c1', name:name || 'Mochi', breed:'orange', fullness:80, happiness:75, lastSim:now, collar:null, adopted:today()}],
    coins:50, salmon:0, xp:0,
    inv:{kibble:2, tuna:0},
    owned:{}, toyCd:{}, xpBoostUntil:0,
    pet:{day:today(), gained:0},
    days:{}, log:[{t:now, text:'ของขวัญต้อนรับ', coins:50}],
    settings:{moveGoal:400, exGoal:30, standGoal:12, age:30, gentle:false, sound:true}
  };
}
function cat(){ return S.cats.find(c => c.id === S.activeCat) || S.cats[0]; }
function emptyDay(){ return {steps:0, kcal:0, ex:0, stand:0, appSteps:0, workouts:[], awarded:{coins:0, salmon:0}, happy:{sum:0, n:0, at:0}, syncedAt:0}; }
function day(k){ if (!S.days[k]) S.days[k] = emptyDay(); return S.days[k]; }
function peek(k){ return S.days[k] || null; }
function effSteps(d){ return d ? Math.max(d.steps || 0, d.appSteps || 0) : 0; }
function effEx(d){ if (!d) return 0; const own = d.workouts.filter(w => w.src !== 'health').reduce((a, w) => a + w.min, 0); return Math.max(d.ex || 0, own); }
function qualityMin(d){ return d ? d.workouts.reduce((a, w) => a + (w.z2 || 0), 0) : 0; }
function isActive(d){ return !!d && (effEx(d) >= 10 || d.workouts.some(w => w.min >= 10) || effSteps(d) >= 5000); }
function addLog(text, coins){ S.log.unshift({t:Date.now(), text, coins}); S.log = S.log.slice(0, 40); }

// ---------- reward engine ----------
function streakAt(k){
  let s = 0, lastRest = -99;
  for (let i = 0; i < 400; i++){
    const key = addDays(k, -i);
    if (S.created && keyToDate(key) < keyToDate(keyOf(new Date(S.created)))) break;
    if (isActive(peek(key))) s++;
    else { if (i === 0) return 0; if (i - lastRest < 7 || i - lastRest === 1) break; lastRest = i; }
  }
  return s;
}
function displayStreak(){ const t = today(); return isActive(peek(t)) ? streakAt(t) : streakAt(addDays(t, -1)); }
function computeDay(k){
  const d = peek(k); if (!d) return {coins:0, salmon:0, parts:null};
  const st = S.settings;
  const steps = effSteps(d), exAll = effEx(d), ex = Math.min(120, exAll), kcal = d.kcal || 0;
  const pSteps = Math.floor(steps / 500), pEx = 2 * Math.round(ex), pK = Math.floor(kcal / 10);
  const rMove = kcal >= st.moveGoal ? 20 : 0, rEx = exAll >= st.exGoal ? 20 : 0, rStand = (d.stand || 0) >= st.standGoal ? 10 : 0;
  const rAll = (rMove && rEx && rStand) ? 25 : 0;
  let W = 0, salmon = 0;
  d.workouts.filter(w => w.min >= 10).slice(0, 3).forEach(w => {
    const q = w.min ? (w.z2 || 0) / w.min : 0;
    const M = q >= 0.7 ? 1.5 : q >= 0.4 ? 1.25 : 1;
    W += 10 + Math.round(w.min * 2 * (M - 1));
    salmon += Math.floor((w.z2 || 0) / 20);
  });
  salmon = Math.min(2, salmon);
  const streak = streakAt(k), mult = 1 + 0.05 * Math.min(streak, 5);
  const sub = pSteps + pEx + pK + rMove + rEx + rStand + rAll + W;
  let x = sub * mult; if (x > 300) x = 300 + 0.5 * (x - 300);
  const coins = Math.floor(Math.min(500, x) + 1e-9);
  return {coins, salmon, parts:{pSteps, pEx, pK, rings:rMove + rEx + rStand + rAll, W, streak, mult, sub}};
}
function award(k){
  const d = day(k), r = computeDay(k);
  let gotC = 0, gotS = 0;
  const dc = r.coins - (d.awarded.coins || 0), ds = r.salmon - (d.awarded.salmon || 0);
  if (dc > 0){ gotC = dc; S.coins += dc; S.xp += Date.now() < S.xpBoostUntil ? dc * 2 : dc; d.awarded.coins = r.coins; }
  if (ds > 0){ gotS = ds; S.salmon += ds; d.awarded.salmon = r.salmon; }
  if (gotC || gotS){ addLog((k === today() ? 'กิจกรรมวันนี้' : 'กิจกรรม ' + k.slice(5).split('-').reverse().join('/')) + (gotS ? ' + Salmon ' + gotS : ''), gotC); }
  return {gotC, gotS, total:r};
}
function levelInfo(xp){
  xp = xp == null ? S.xp : xp; let n = 1;
  while (200 * (n + 1) * n <= xp) n++;
  const base = 200 * n * (n - 1), need = 400 * n;
  return {level:n, into:xp - base, need, pct:(xp - base) / need};
}

// ---------- cat simulation ----------
function simulateAll(now){
  now = now || Date.now();
  S.cats.forEach(c => {
    let h = (now - c.lastSim) / 3.6e6;
    if (h <= 0){ c.lastSim = now; return; }
    h = Math.min(h, 24 * 60);
    const tHigh = c.fullness > 30 ? Math.min(h, (c.fullness - 30) / 3) : 0;
    c.happiness -= tHigh * 1 + (h - tHigh) * 2;
    c.fullness -= 3 * h;
    c.fullness = clamp(c.fullness, 0, 100);
    c.happiness = clamp(c.happiness, 5, 100);
    c.lastSim = now;
  });
  if (S.pet.day !== today()) S.pet = {day:today(), gained:0};
  const d = day(today());
  if (!d.happy.at || now - d.happy.at > 10 * 60e3){ d.happy.sum += cat().happiness; d.happy.n += 1; d.happy.at = now; }
}
function energyNow(){ const d = peek(today()); return Math.round(30 + 70 * Math.min(1, effEx(d) / S.settings.exGoal)); }
function lastActiveGap(){
  const t = today();
  for (let i = 0; i < 60; i++){ if (isActive(peek(addDays(t, -i)))) return i; }
  return daysBetween(keyOf(new Date(S.created)), t);
}
function getMood(){
  const c = cat(), now = Date.now();
  if (UI.walking) return 'cheering';
  if (now < UI.eatingUntil) return 'eating';
  if (UI.petting || now < UI.happyUntil) return 'happy';
  const h = new Date().getHours();
  if (h >= 22 || h < 6) return 'sleeping';
  if (c.fullness < 30) return 'hungry';
  if (lastActiveGap() >= 2) return 'waiting';
  if (c.happiness < 20) return 'sulking';
  if (c.happiness > 80 && energyNow() > 50) return 'playful';

let AC = null, purr = null;
function audioReady(){ if (!S || !S.settings.sound) return null; try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); return AC; } catch (e) { return null; } }
function purrStart(){
  if (purr || !AC || !S.settings.sound) return;
  try {
    const len = AC.sampleRate * 2, buf = AC.createBuffer(1, len, AC.sampleRate), ch = buf.getChannelData(0);
    let last = 0; for (let i = 0; i < len; i++){ const w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; ch[i] = last * 3.5; }
    const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 240;
    const am = AC.createGain(); am.gain.value = 0.5;
    const lfo = AC.createOscillator(); lfo.frequency.value = 25; const lg = AC.createGain(); lg.gain.value = 0.5; lfo.connect(lg); lg.connect(am.gain);
    const g = AC.createGain(); g.gain.value = 0;
    src.connect(lp); lp.connect(am); am.connect(g); g.connect(AC.destination);
    src.start(); lfo.start(); g.gain.linearRampToValueAtTime(0.5, AC.currentTime + 0.3);
    purr = {src, lfo, g};
  } catch (e) {}
}
function purrStop(){
  if (!purr || !AC) return; const p = purr; purr = null;
  try { p.g.gain.cancelScheduledValues(AC.currentTime); p.g.gain.setValueAtTime(p.g.gain.value, AC.currentTime); p.g.gain.linearRampToValueAtTime(0, AC.currentTime + 0.5);
    setTimeout(() => { try { p.src.stop(); p.lfo.stop(); } catch (e) {} }, 650); } catch (e) {}
}
function meow(){
  const ac = audioReady(); if (!ac) return;
  try { const o = ac.createOscillator(), g = ac.createGain(), f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1100; f.Q.value = 1.2;
    o.type = 'sawtooth'; const t = ac.currentTime;
    o.frequency.setValueAtTime(520, t); o.frequency.linearRampToValueAtTime(880, t + 0.16); o.frequency.linearRampToValueAtTime(470, t + 0.42);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.18, t + 0.05); g.gain.linearRampToValueAtTime(0.12, t + 0.3); g.gain.linearRampToValueAtTime(0, t + 0.45);
    o.connect(f); f.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + 0.5); } catch (e) {}
}
function chime(){
  const ac = audioReady(); if (!ac) return;
  try { const t = ac.currentTime; [880, 1320].forEach((fr, i) => { const o = ac.createOscillator(), g = ac.createGain(); o.type = 'sine'; o.frequency.value = fr;
    g.gain.setValueAtTime(0, t + i * .09); g.gain.linearRampToValueAtTime(.12, t + i * .09 + .02); g.gain.exponentialRampToValueAtTime(.001, t + i * .09 + .35);
    o.connect(g); g.connect(ac.destination); o.start(t + i * .09); o.stop(t + i * .09 + .4); }); } catch (e) {}
}

const Store = {
  mode:'local', ref:null, writing:false, pending:false, timer:null,
  loadLocal(){ try { const t = localStorage.getItem(LS_KEY); return t ? JSON.parse(t) : null; } catch (e) { return null; } },
  saveLocal(){ try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {} },
  async connect(){
    try {
      if (!window.claude || typeof window.claude.use !== 'function') return null;
      const pair = await timeout(Promise.all([window.claude.use('db'), window.claude.use('user')]), 12000);
      const db = pair[0], user = pair[1];
      if (!db || !user) return null;
      const uid = await timeout(user.id(), 8000);
      if (!uid) return null;
      this.ref = db.doc('data/users/' + uid + '/meowmotion');
      const snap = await timeout(this.ref.get(), 10000);
      this.mode = 'cloud';
      if (snap && snap.exists){ const body = snap.data(); if (body && typeof body.json === 'string') return JSON.parse(body.json); }
      return {};
    } catch (e) { this.ref = null; this.mode = 'local'; return null; }
  },
  save(){ if (!S) return; S.savedAt = Date.now(); this.saveLocal(); clearTimeout(this.timer); this.timer = setTimeout(() => this.flush(), 1500); },
  async flush(){
    if (!this.ref || !S) return;
    if (this.writing){ this.pending = true; return; }
    this.writing = true;
    try { await this.ref.set({v:1, savedAt:S.savedAt, json:JSON.stringify(S)}); }
    catch (e) { if (e && (e.code === 'invalid_argument' || e.code === 'revoked' || e.code === 'quota_exceeded')){ this.ref = null; this.mode = 'local'; } }
    this.writing = false;
    if (this.pending){ this.pending = false; this.flush(); }
  }
};

    (btn === 'walk' ? `<button class="btn primary" style="min-height:40px;padding:0 12px" data-act="walk">${ICON.walk('#fff',16)}เดิน</button>` : `<button class="btn ghost" style="min-height:40px;padding:0 12px" data-act="play">เล่นด้วย</button>`) + `</div>`;
}

function renderStatsTab(){
  const n = UI.range === 'week' ? 7 : 30, keys = Array.from({length:n}, (_, i) => addDays(today(), i - (n - 1)));
  const ds = keys.map(k => peek(k));
  const kcal = ds.reduce((a, d) => a + (d ? d.kcal || 0 : 0), 0), exSum = ds.reduce((a, d) => a + effEx(d), 0);
  const hs = ds.filter(d => d && d.happy.n).map(d => d.happy.sum / d.happy.n);
  const avgH = hs.length ? Math.round(hs.reduce((a, b) => a + b, 0) / hs.length) : Math.round(cat().happiness);
  const lv = levelInfo(), streak = displayStreak();
  const wk = Array.from({length:7}, (_, i) => peek(addDays(today(), -i))).reduce((a, d) => a + qualityMin(d), 0);
  const first = keyToDate(keys[0]), last = keyToDate(keys[n - 1]);
  const mTH = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  const range = `${first.getDate()} ${mTH[first.getMonth()]} – ${last.getDate()} ${mTH[last.getMonth()]} ${last.getFullYear()}`;
  // chart
  const W = 320, H = 112, goal = S.settings.exGoal;
  const vals = ds.map(d => effEx(d)), qs = ds.map(d => Math.min(qualityMin(d), effEx(d)));
  const maxV = Math.max(goal * 1.5, ...vals, 1), sc = (H - 6) / maxV, colW = W / n, bw = n === 7 ? 22 : 6;
  let bars = '';
  vals.forEach((v, i) => {
    const x = colW * i + colW / 2 - bw / 2, h = Math.max(v > 0 ? 3 : 0, v * sc), qh = Math.min(h, qs[i] * sc);
    if (v > 0){
      bars += `<rect x="${x.toFixed(1)}" y="${(H - h).toFixed(1)}" width="${bw}" height="${h.toFixed(1)}" rx="${n===7?7:3}" fill="#A9E3C9"/>`;
      if (qh > 0) bars += `<rect x="${x.toFixed(1)}" y="${(H - qh).toFixed(1)}" width="${bw}" height="${qh.toFixed(1)}" rx="${n===7?7:3}" fill="#23A272"/>`;
    } else bars += `<rect x="${x.toFixed(1)}" y="${H - 3}" width="${bw}" height="3" rx="1.5" fill="#E9E6F1"/>`;
  });
  const gy = (H - goal * sc).toFixed(1);
  const labels = keys.map((k, i) => { const dt = keyToDate(k); const isT = i === n - 1;
    if (n === 7) return `<span style="${isT ? 'color:var(--ink);font-weight:800' : ''}">${isT ? 'วันนี้' : DAY_TH[dt.getDay()]}</span>`;
    return (i % 5 === 4 || isT) ? `<span style="grid-column:${i + 1};${isT ? 'color:var(--ink);font-weight:800' : ''}">${dt.getDate()}</span>` : ''; }).join('');
  // happiness line
  const hp = ds.map(d => d && d.happy.n ? d.happy.sum / d.happy.n : null);
  const lineY = v => (34 - (v - 0) / 100 * 30).toFixed(1);
  let segs = [], cur = [];
  hp.forEach((v, i) => { if (v == null){ if (cur.length) segs.push(cur); cur = []; } else cur.push(`${(colW * i + colW / 2).toFixed(1)},${lineY(v)}`); });
  if (cur.length) segs.push(cur);
  const line = segs.map(sg => sg.length > 1 ? `<polyline points="${sg.join(' ')}" fill="none" stroke="#7B6AE0" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>` : '').join('') +
    hp.map((v, i) => v == null ? '' : `<circle cx="${(colW * i + colW / 2).toFixed(1)}" cy="${lineY(v)}" r="${n === 7 ? 3 : 2}" fill="#7B6AE0"/>`).join('');
  const hasData = vals.some(v => v > 0);
  const logs = S.log.slice(0, 8).map(l => `<div class="logrow"><span><span class="muted">${new Date(l.t).getDate()}/${new Date(l.t).getMonth() + 1} ${timeTH(l.t)}</span> · ${esc(l.text)}</span><b style="color:${l.coins >= 0 ? 'var(--honeyD)' : 'var(--ink2)'}">${l.coins >= 0 ? '+' : ''}${fmt(l.coins)}</b></div>`).join('');
  return `
  <header class="top"><div class="col g4"><h1 class="title" style="font-size:28px;line-height:34px">สถิติ</h1><span class="sub">${range}</span></div>
    <span class="chip lav" style="font-size:13px;padding:7px 12px">${ICON.paw('#5B4BB8',16)} Streak ${streak} วัน</span></header>
  <div class="seg" role="tablist" aria-label="ช่วงเวลา">
    <button role="tab" aria-selected="${UI.range === 'week'}" class="${UI.range === 'week' ? 'on' : ''}" data-act="range" data-v="week">สัปดาห์</button>
    <button role="tab" aria-selected="${UI.range === 'month'}" class="${UI.range === 'month' ? 'on' : ''}" data-act="range" data-v="month">30 วัน</button>
  </div>
  <div class="grid2">
    <section class="card col g10" style="padding:14px"><span class="row g6 small" style="font-weight:800;color:var(--mintD)">${ICON.pulse('#1B6E4E',16)}สุขภาพของคุณ</span>
      <div class="col"><span class="big">${fmt(kcal)} <span class="small muted" style="font-weight:700">kcal</span></span><span class="small muted">พลังงานเคลื่อนไหว</span></div>
      <div class="col"><span class="big">${fmt(exSum)} <span class="small muted" style="font-weight:700">นาที</span></span><span class="small muted">ออกกำลังกาย</span></div></section>
    <section class="card col g10" style="padding:14px"><span class="row g6 small" style="font-weight:800;color:var(--lavD)">${TAB_ICON.cat(false).replace('currentColor','#5B4BB8').replace('width="24" height="24"','width="16" height="16"')}การเติบโตของ ${esc(cat().name)}</span>
      <div class="col"><span class="big">${avgH}%</span><span class="small muted">ความสุขเฉลี่ย</span></div>
      <div class="col g4"><div class="row between" style="align-items:baseline"><span class="big">Lv ${lv.level}</span><span class="small" style="font-weight:800;color:var(--lavD)">${Math.floor(lv.pct * 100)}%</span></div>
      <div class="mini-track"><div style="width:${Math.floor(lv.pct * 100)}%;height:100%;border-radius:999px;background:#7B6AE0"></div></div></div></section>
  </div>
  <section class="card col g8" style="padding:16px">
    <div class="row between" style="align-items:baseline"><h2 style="font-size:15px;font-weight:800">นาทีออกกำลังกายรายวัน</h2><span class="small muted">เฉลี่ย ${fmt(exSum / n)} นาที/วัน</span></div>
    <div class="row g12 tiny muted" style="font-weight:600;flex-wrap:wrap"><span class="row g4"><span style="width:10px;height:10px;border-radius:3px;background:#23A272"></span>Zone 2 / เดินเร็ว</span><span class="row g4"><span style="width:10px;height:10px;border-radius:3px;background:#A9E3C9"></span>ความเข้มอื่น</span><span class="row g4"><span style="width:14px;border-top:2px dashed #A44A24"></span>เป้า ${goal} นาที</span></div>
    <svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;margin-top:4px" role="img" aria-label="กราฟนาทีออกกำลังกาย ${n} วัน">${bars}<line x1="0" x2="${W}" y1="${gy}" y2="${gy}" stroke="#A44A24" stroke-width="1.5" stroke-dasharray="5 4" opacity=".75"/></svg>
    <div style="display:grid;grid-template-columns:repeat(${n},minmax(0,1fr));justify-items:center;font-size:${n === 7 ? 12 : 10.5}px;color:var(--ink2);font-weight:600">${labels}</div>
    ${hasData ? '' : `<p class="empty">ยังไม่มีข้อมูล — กดอัปเดตจาก Apple Health หรือพาเดินเล่น</p>`}
    <div class="divider"></div>
    <div class="row between" style="align-items:baseline"><span class="small" style="font-weight:800;color:var(--lavD)">ความสุขของ ${esc(cat().name)}</span><span class="tiny muted">แกนวันเดียวกับกราฟบน</span></div>
    <svg viewBox="0 0 ${W} 38" width="100%" style="display:block" role="img" aria-label="ความสุขของแมวรายวัน">${line || ''}</svg>
  </section>
  <section class="card col g8">
    <div class="row between" style="align-items:baseline"><span class="row g6" style="font-size:14px;font-weight:800">${ICON.heart('#1B6E4E')}Zone 2 / เดินเร็ว 7 วันล่าสุด</span><span style="font-size:15px;font-weight:800">${fmt(wk)}<span class="small muted" style="font-weight:700"> / 150 นาที</span></span></div>
    <div style="height:10px;border-radius:999px;background:#E3F5EC;overflow:hidden"><div style="width:${Math.min(100, wk / 150 * 100)}%;height:100%;border-radius:999px;background:#23A272"></div></div>
    <span class="small muted">${wk >= 150 ? 'ครบเป้าแล้ว เยี่ยมมาก!' : `อีก ${fmt(150 - wk)} นาทีถึงเป้า`} · อิงคำแนะนำ WHO 150–300 นาที/สัปดาห์</span>
  </section>
  <section class="card col g4"><h2 style="font-size:15px;font-weight:800;margin-bottom:2px">ที่มาของ Coins</h2>
    <div class="loglist">${logs || '<p class="empty">ยังไม่มีรายการ</p>'}</div></section>`;
}

function attachPet(){
  const el = document.getElementById('catwrap'), room = document.getElementById('room'); if (!el) return;
  let down = false, dist = 0, lx = 0, ly = 0, moved = false, lastHeart = 0, pid = null;
  el.addEventListener('pointerdown', e => { down = true; dist = 0; moved = false; lastHeart = 0; lx = e.clientX; ly = e.clientY; pid = e.pointerId; try { el.setPointerCapture(e.pointerId); } catch (er) {} audioReady(); });
  el.addEventListener('pointermove', e => {
    if (!down) return; const dd = Math.hypot(e.clientX - lx, e.clientY - ly); lx = e.clientX; ly = e.clientY; dist += dd;
    if (!moved && dist > 14){ moved = true; UI.petting = true; Pet.busy = false; refreshCat(); purrStart(); }
    if (moved && dist - lastHeart > 46){ lastHeart = dist; spawnHeart(room, e.clientX, e.clientY); haptic(); }
  });
  const end = () => {
    if (!down) return; down = false; try { el.releasePointerCapture(pid); } catch (er) {}
    if (moved){ UI.petting = false; UI.happyUntil = Date.now() + 1800; purrStop(); petReward(dist); refreshCat(); }
    else { const svg = el.querySelector('svg'); if (svg){ svg.classList.remove('hop'); void svg.getBoundingClientRect(); svg.classList.add('hop'); } else if (Live.ready()) Live.play('blink'); meow(); haptic(); }
    setTimeout(() => { if (!UI.petting && !UI.walking && UI.tab === 'cat') refreshCat(); }, 2000);
  };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end); el.addEventListener('lostpointercapture', end);
}

function parseHealth(text){
  const raw = String(text || '').trim(); if (!raw) return null;
  try { const j = JSON.parse(raw); if (j && typeof j === 'object'){ const o = {}; ['steps','kcal','ex','stand','z2','wmin'].forEach(k => { const v = num(j[k]); if (v != null) o[k] = v; }); if (typeof j.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(j.date)) o.date = j.date; if (Object.keys(o).length) return o; } } catch (e) {}
  const t = raw.replace(/(\d),(\d{3})/g, '$1$2');
  const pick = re => { const m = t.match(re); return m ? num(m[1]) : null; };
  const o = {};
  const steps = pick(/(?:^|[^a-z])(?:steps?|ก้าว)\s*[=:]\s*([\d.]+)/i); if (steps != null) o.steps = steps;
  const kcal = pick(/(?:kcal|active\s*energy|energy|cal(?:ories)?|แคลอรี่?)\s*[=:]\s*([\d.]+)/i); if (kcal != null) o.kcal = kcal;
  const ex = pick(/(?:^|[^a-z])(?:exercise|ex|นาทีออกกำลัง(?:กาย)?)\s*[=:]\s*([\d.]+)/i); if (ex != null) o.ex = ex;
  const stand = pick(/(?:stand|ยืน)\s*[=:]\s*([\d.]+)/i); if (stand != null) o.stand = stand;
  const z2 = pick(/(?:z2|zone\s*2|zone2)\s*[=:]\s*([\d.]+)/i); if (z2 != null) o.z2 = z2;
  const wmin = pick(/(?:wmin|workout)\s*[=:]\s*([\d.]+)/i); if (wmin != null) o.wmin = wmin;
  const dt = t.match(/date\s*[=:]\s*(\d{4}-\d{2}-\d{2})/i); if (dt) o.date = dt[1];
  return Object.keys(o).length ? o : null;
}
function applyHealth(v){
  const k = v.date && v.date <= today() ? v.date : today(), d = day(k);
  ['steps','kcal','ex','stand'].forEach(f => { if (v[f] != null && isFinite(v[f])) d[f] = Math.max(0, Math.round(v[f])); });
  if (v.z2 != null || v.wmin != null){
    const z2 = Math.max(0, Math.round(v.z2 || 0)), min = Math.max(z2, Math.round(v.wmin != null ? v.wmin : z2));
    d.workouts = d.workouts.filter(w => w.id !== 'health-' + k);
    if (min > 0) d.workouts.push({id:'health-' + k, type:'workout', min, z2, src:'health', at:Date.now()});
  }
  d.syncedAt = Date.now();
  const r = award(k); save(); return r;
}

    add(box, [{transform:'translateY(0)'},{transform:'translateY(0)', offset:.62},{transform:'translateY(-10px)', offset:.7},{transform:'translateY(0)', offset:.78},{transform:'translateY(0)'}], {duration:6000});
  }
  // idle (paused / standing still): just breathe
}
function wkRate(w, cad){
  const a = ACTS[w.act]; let g, rate = 1, scene = 1;
  if (w.pausedAt){ g = 'idle'; scene = 0; }
  else if (w.act === 'yoga'){ g = 'yoga'; scene = 0; }
  else if (w.act === 'strength'){ g = 'strength'; scene = 0; }
  else if (w.motion && w.act !== 'cycle'){
    if (cad < 20){ g = 'idle'; scene = 0; }
    else if (cad < 130){ g = 'walk'; rate = clamp(cad / 105, .55, 1.35); scene = clamp(cad / 110, .4, 1.3); }
    else if (cad < 160){ g = 'trot'; rate = clamp(cad / 145, .8, 1.3); scene = clamp(cad / 110, .9, 1.7); }
    else { g = 'gallop'; rate = clamp(cad / 170, .85, 1.3); scene = 2; }
  } else { g = w.act === 'run' ? 'trot' : 'walk'; scene = w.act === 'run' ? 1.4 : w.act === 'cycle' ? 1.7 : 1; }
  wkGait(w, g); WkVid.update(w, g, rate); w.anims.forEach(x => { try { x.playbackRate = rate; } catch (e) {} }); w.scene.forEach(x => { try { x.playbackRate = Math.max(scene, 0.0001); if (scene === 0) x.pause(); else if (x.playState === 'paused') x.play(); } catch (e) {} });
}
function wkFx(w, kind){
  const sc = document.getElementById('wkScene'), c = document.getElementById('wkCat'); if (!sc || !c || RMOTION) return;
  const r = sc.getBoundingClientRect(), b = c.getBoundingClientRect(), f = document.createElement('div'); f.className = 'fx';
  f.style.left = (b.left - r.left + b.width * (.3 + Math.random() * .4)) + 'px'; f.style.top = (b.top - r.top + 10) + 'px'; f.style.setProperty('--dx', (Math.random() * 40 - 20) + 'px');
  f.innerHTML = kind === 'note' ? `<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M9 18V5l11-2v13" stroke="#5B4BB8" stroke-width="2.2" fill="none" stroke-linecap="round"/><circle cx="6.5" cy="18" r="3" fill="#5B4BB8"/><circle cx="17.5" cy="16" r="3" fill="#5B4BB8"/></svg>` : heartPath(Math.random() > .5 ? '#F28BA8' : '#EE5D5D');
  sc.appendChild(f); setTimeout(() => f.remove(), 2300);
}
async function wkInterval(w, title, sub){
  const pop = document.getElementById('wkPop'), box = document.getElementById('wkCat'); if (!pop) return;
  pop.innerHTML = `${esc(title)}<small>${esc(sub)}</small>`; pop.classList.add('show'); haptic(); chime(); setTimeout(meow, 350);
  if (box && !RMOTION){ w.anims.forEach(a => a.pause()); const s = box.querySelector('svg'); if (s){ s.dataset.eyes = 'happy'; s.dataset.mouth = 'open'; }
    await box.animate([{transform:'translateY(0) scale(1)'},{transform:'translateY(8px) scale(1.32)', offset:.35},{transform:'translateY(-30px) scale(1.36)', offset:.55},{transform:'translateY(8px) scale(1.32)', offset:.72},{transform:'translateY(8px) scale(1.32)', offset:.85},{transform:'translateY(0) scale(1)'}], {duration:2400, easing:'ease-in-out'}).finished.catch(() => {});
    w.anims.forEach(a => a.play()); }

function wkNumbers(w){
  const ms = wkElapsed(w), sec = Math.floor(ms / 1000), min = Math.floor(sec / 60);
  const brisk = w.motion ? w.brisk : Math.floor(w.talkSec / 60);
  let est = 0;
  try { const k = today(), d = day(k), keep = d.appSteps; d.workouts.push({id:'tmp', type:w.act, min, z2:Math.min(brisk, min), src:w.motion ? 'motion' : 'timer'}); d.appSteps = (d.appSteps || 0) + w.steps;
    est = Math.max(0, computeDay(k).coins - (d.awarded.coins || 0)); d.workouts.pop(); d.appSteps = keep; } catch (e) {}
  const now = Date.now(); w.stepTimes = w.stepTimes.filter(t => now - t < 10000); const cad = w.stepTimes.length * 6;

}
function wkTick(){
  const w = UI.walking; if (!w || !document.getElementById('wk')) return; const now = Date.now();
  const dt = Math.min(5, (now - w.lastTick) / 1000); w.lastTick = now;
  if (!w.pausedAt){
    while (now - w.curStart >= 60000){ if (w.motion && w.curSteps >= 100) w.brisk++; w.curSteps = 0; w.curStart += 60000; }
    if (!w.motion && w.talk) w.talkSec += dt;
  }
  const n = wkNumbers(w);
  // place auto-detect (every 15 s after 45 s, 2 matching votes to switch)
  if (w.auto && !w.pausedAt && n.sec >= 45 && now - (w.lastVote || 0) >= 15000){ w.lastVote = now;
    let v = null;
    if (w.fix && w.maxDisp >= 30) v = 'outdoor';
    else if (w.fix && w.maxDisp < 10 && (w.steps >= 60 || (w.act === 'cycle' && n.sec >= 90))) v = 'indoor';
    if (v){ w.votes.push(v); w.votes = w.votes.slice(-2); if (w.votes.length === 2 && w.votes[0] === v && w.votes[1] === v && v !== w.place){ w.place = v; wkScene(w); wkChips(w); toast(v === 'outdoor' ? 'ออกไปข้างนอกแล้ว เปลี่ยนเป็นฉากสวน' : 'ดูเหมือนอยู่บนลู่วิ่ง เปลี่ยนเป็นฉากในห้อง', 2200); } }
  }
  if (now - (w.lastScene || 0) >= 60000){ w.lastScene = now; wkScene(w); wkChips(w); }
  // pace-matched animation
  wkRate(w, n.cad);
  // intensity: cadence (sensor) or talk test
  const level = w.pausedAt ? 0 : w.motion && w.act !== 'cycle' && w.act !== 'yoga' && w.act !== 'strength' ? (n.cad >= 130 ? 3 : n.cad >= 100 ? 2 : n.cad >= 20 ? 1 : 0) : (w.talk ? 2 : 1);
  ['wkZ1','wkZ2','wkZ3'].forEach((id, i) => { const z = document.getElementById(id); if (z) z.classList.toggle('on', level === i + 1); });
  if ((level === 2 || level === 3) && now - w.lastFx > 4000){ w.lastFx = now; wkFx(w, level === 3 ? 'note' : 'heart'); }
  // interval coach
  if (!w.pausedAt && w.fired < w.marks.length && n.min >= w.marks[w.fired]){
    const i = w.fired; w.fired++;
    if (w.interval === 'auto') wkInterval(w, w.markText[i] || 'เก่งมาก!', `ออกกำลังไปแล้ว ${n.min} นาที`);
    else wkInterval(w, `ครบ ${n.min} นาทีแล้ว! สู้ต่อนะ`, `${w.motion ? fmt(w.steps) + ' ก้าว · ' : ''}เดินเร็ว ${n.brisk} นาที`);
  }
  // dashboard
  const set = (id, v) => { const x = document.getElementById(id); if (x && x.textContent !== String(v)) x.textContent = v; };
  const h = Math.floor(n.sec / 3600), m = Math.floor(n.sec / 60) % 60, s2 = String(n.sec % 60).padStart(2,'0');
  set('wkTime', h ? `${h}:${String(m).padStart(2,'0')}:${s2}` : `${m}:${s2}`); set('wkCoins', '+' + fmt(n.est));
  const showDist = w.place === 'outdoor' && w.fix;
  set('wkM1', showDist ? (w.dist / 1000).toFixed(2) : (w.motion ? fmt(w.steps) : '—')); set('wkL1', showDist ? 'กม.' : 'ก้าว');
  if (showDist && w.dist > 50 && n.sec > 0){ const pace = (n.sec / 60) / (w.dist / 1000); set('wkM2', Math.floor(pace) + ':' + String(Math.round((pace % 1) * 60)).padStart(2,'0')); set('wkL2', 'นาที/กม.'); }
  else { set('wkM2', w.motion ? n.cad : '—'); set('wkL2', 'ก้าว/นาที'); }
  set('wkM3', n.brisk);
  const talk = document.getElementById('wkTalk'); if (talk) talk.hidden = !!(w.motion && ['walk','run'].includes(w.act)) || ['yoga','strength'].includes(w.act) || n.sec < 3;
}
function wkPause(){
  const w = UI.walking; if (!w) return; const b = document.getElementById('wkPauseBtn');
  if (w.pausedAt){ w.pausedMs += Date.now() - w.pausedAt; w.pausedAt = 0; if (b) b.textContent = 'พัก'; const s = document.querySelector('#wkCat svg'); if (s){ s.dataset.eyes = 'happy'; s.dataset.mouth = 'open'; } }
  else { w.pausedAt = Date.now(); if (b) b.textContent = 'เล่นต่อ'; const s = document.querySelector('#wkCat svg'); if (s){ s.dataset.eyes = 'open'; s.dataset.mouth = 'w'; } }

}
function endWorkout(keep){
  const w = UI.walking; if (!w) return;
  clearInterval(w.timer); try { window.removeEventListener('devicemotion', w.handler); } catch (e) {}
  try { if (w.geo != null) navigator.geolocation.clearWatch(w.geo); } catch (e) {} try { if (w.wake) w.wake.release(); } catch (e) {}
  const n = wkNumbers(w); UI.walking = null; WkVid.stop(); const el = document.getElementById('wk'); if (el) el.remove();
  if (ACTS[w.act].out && w.auto && w.fix) wPrefs().lastPlace[w.act] = w.place;

    <div class="row g8" style="justify-content:center;flex-wrap:wrap"><span class="pill coin">${coinSVG()}+${fmt(r.gotC)} Coins</span>${r.gotS ? `<span class="pill salmon">${fishSVG()}+${r.gotS} Salmon</span>` : ''}</div>
    <span class="small muted">${n.min < 10 ? 'ครบ 10 นาทีขึ้นไปจะได้โบนัส workout +10' : r.gotS ? 'ได้ Premium Salmon จากการอยู่ระดับปานกลางครบ 20 นาที' : 'ยิ่งอยู่ระดับปานกลางต่อเนื่อง ยิ่งได้โบนัส'}</span>
    <button class="btn lavb full" data-act="close">กลับไปหา ${esc(cat().name)}</button></div>`, 'สรุปการออกกำลังกาย');

// ---------- actions ----------

    const curMin = Math.floor(wkElapsed(w) / 60000); w.fired = 0;

    else if (w.interval === 'off') w.marks = [];

  sync(){ syncSheet(); }, guide(){ guideSheet(); },

  importPaste(){ const v = parseHealth($('#pasteBox') && $('#pasteBox').value); if (!v){ toast('อ่านข้อมูลไม่ออก ลองวางข้อความจาก Shortcut อีกครั้ง'); return; } const r = applyHealth(v); closeSheet(); render(); announce(r); },

    const r = applyHealth(v); closeSheet(); render(); announce(r);
  },
  range(el){ UI.range = el.dataset.v; render(); },
  shopcat(el){ UI.shopCat = el.dataset.v; render(); },
  buy(el){ buySheet(el.dataset.id); }, confirmBuy(el){ confirmBuy(el.dataset.id); },

  setcat(el){ S.activeCat = el.dataset.id; save(); render(); haptic(); toast(`${esc(cat().name)} มาอยู่บ้านแล้ว`); },
  adopt(el){ const k = el.dataset.v, b = BREEDS[k]; if (!b || levelInfo().level < b.lv) return;

      <div class="field" style="width:100%;text-align:left"><label for="adoptName">ตั้งชื่อ</label><input class="input" id="adoptName" maxlength="20" placeholder="เช่น Tofu" autocomplete="off"></div>

  adoptOk(el){ const k = el.dataset.v, name = ($('#adoptName').value.trim() || BREEDS[k].name).slice(0, 20), id = 'c' + Date.now();

  export(){

    const fallback = () => openSheet(`<h2>ข้อมูลสำรอง</h2><p class="small muted" style="margin:0 0 10px">กดค้างเพื่อเลือกทั้งหมดแล้วคัดลอก</p><textarea class="input" style="height:200px;font-size:12px" readonly>${esc(txt)}</textarea><button class="btn lavb full" style="margin-top:12px" data-act="close">เสร็จ</button>`, 'ข้อมูลสำรอง');

  import(){ openSheet(`<h2>นำเข้าข้อมูลสำรอง</h2><p class="small muted" style="margin:0 0 10px">วางข้อความที่คัดลอกไว้ ข้อมูลปัจจุบันจะถูกแทนที่</p><textarea class="input" id="importBox" style="height:160px;font-size:12px" autocomplete="off" spellcheck="false"></textarea>
    <div class="row g10" style="margin-top:12px"><button class="btn ghost grow" data-act="close">ยกเลิก</button><button class="btn primary grow" data-act="importOk">นำเข้า</button></div>`, 'นำเข้าข้อมูล'); },
  importOk(){ let st = null; try { st = migrate(JSON.parse($('#importBox').value)); } catch (e) {} if (!st){ toast('ข้อมูลไม่ถูกต้อง'); return; } S = st; save(); closeSheet(); render(); toast('นำเข้าข้อมูลแล้ว'); },

document.addEventListener('click', e => {

});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-set]'); if (!el || !S) return;
  const k = el.dataset.set, st = S.settings;
  if (k === 'catName'){ const v = el.value.trim().slice(0, 20); if (v){ cat().name = v; save(); toast('เปลี่ยนชื่อแล้ว'); } else el.value = cat().name; return; }
  if (k === 'sound' || k === 'gentle' || k === 'live'){ st[k] = el.checked; if (k === 'live') Live.failed = false; save(); haptic(); return; }
  const lim = {moveGoal:[50,3000], exGoal:[5,300], standGoal:[1,24], age:[10,100]}[k];
  const v = num(el.value); if (v == null || !lim){ el.value = st[k]; return; }
  st[k] = Math.round(clamp(v, lim[0], lim[1])); el.value = st[k];
  award(today()); save(); render();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.getElementById('sheetBack')) closeSheet(); });

// ---------- routing ----------
function route(){
  const h = (location.hash || '').replace('#','');
  UI.tab = TABS.includes(h) ? h : 'cat';
  closeSheet(); render(); window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
function goTab(name){ UI.tab = name; try { history.replaceState(null, '', '#' + name); } catch (e) {} render(); window.scrollTo(0, 0); }

// ---------- boot ----------
function urlImport(){
  try {
    if (!location.search) return;
    const p = new URLSearchParams(location.search), o = {};
    ['steps','kcal','ex','stand','z2','wmin'].forEach(k => { const v = num(p.get(k)); if (v != null) o[k] = v; });
    const dt = p.get('date'); if (dt && /^\d{4}-\d{2}-\d{2}$/.test(dt)) o.date = dt;
    if (Object.keys(o).length && S){ const r = applyHealth(o); setTimeout(() => announce(r), 500); try { history.replaceState(null, '', location.pathname + location.hash); } catch (e) {} }
  } catch (e) {}
}
function tick(){
  if (!S) return;
  simulateAll(); Store.saveLocal();
  if (UI.tab === 'cat' && !UI.petting && !UI.walking && !Pet.busy && !document.getElementById('sheetBack')){ refreshBars(); refreshCat(); }
}
const BOOT_AT = Date.now();
async function boot(){
  const local = migrate(Store.loadLocal());
  if (local){ S = local; UI.booted = true; simulateAll(); }
  route();
  if (S) urlImport();
  if (!S) setTimeout(() => { if (!S && !UI.booted){ UI.booted = true; render(); } }, 4000);
  const cloud = await Store.connect();
  if (cloud && cloud.cats){
    const c = migrate(cloud);
    const freshHere = S && S.created >= BOOT_AT;
    if (c && (!S || freshHere || (c.savedAt || 0) > (S.savedAt || 0))){ S = c; simulateAll(); Store.saveLocal(); if (!UI.walking){ closeSheet(); render(); } if (freshHere) toast('พบข้อมูลเดิมในบัญชีของคุณ โหลดกลับมาแล้ว'); }
    else if (S) Store.flush();
  } else if (cloud && S){ Store.flush(); }
  if (!UI.booted){ UI.booted = true; if (!S) render(); }
  if (UI.tab === 'me' && S) render();
  setInterval(tick, 30000);
  if (S) setTimeout(() => League.check(), 1500);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible'){ tick(); Live.resume(); } else { Live.pause(); if (S){ Store.saveLocal(); Store.flush(); } } });
}
boot();
